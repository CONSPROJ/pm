<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نقشه‌خوان</title>
<style>
  :root{--bg:#f4f5f7;--surface:#fff;--field:#eef0f3;--line:#e2e5ea;--ink:#1d2430;--muted:#6b7586;--acc:#2f6f9f;--ok:#3f8a62;--bad:#c0392b;--paper:#fbfbfc;--draw:#1d2430;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#11151b;--surface:#181d25;--field:#222833;--line:#2c3440;--ink:#e6e9ee;--muted:#9aa3b1;--paper:#0f1318;--draw:#d7dce3;} }
  :root[data-theme="dark"]{--bg:#11151b;--surface:#181d25;--field:#222833;--line:#2c3440;--ink:#e6e9ee;--muted:#9aa3b1;--paper:#0f1318;--draw:#d7dce3;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"IRANSans",Tahoma,sans-serif;font-size:13px;}
  .app{display:grid;grid-template-rows:auto 1fr;height:100%;}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);}
  .top .nm{display:flex;flex-direction:column;min-width:0;margin-inline-end:auto;} .top .nm b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;} .top .nm small{color:var(--muted);font-size:11px;}
  .seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--field);}
  .seg button, .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .seg button:hover, .btn:hover{color:var(--ink);} .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .seg button svg, .btn svg{width:16px;height:16px;}
  .btn{background:var(--field);} .btn.pri{background:var(--acc);color:#fff;}
  select, input[type=text], input[type=number]{font:inherit;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 8px;}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:0;}
  .stage{position:relative;overflow:hidden;background:var(--paper);touch-action:none;}
  .stage svg#view{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #dwg *{vector-effect:non-scaling-stroke;}
  #dwg [stroke="#000000"], #dwg [stroke="black"], #dwg [stroke="rgb(0,0,0)"]{stroke:var(--draw);}
  #dwg [fill="#000000"]:not(path), #dwg text[fill="#000000"]{fill:var(--draw);}
  .stage.t-pan{cursor:grab} .stage.t-pan.drag{cursor:grabbing} .stage:not(.t-pan){cursor:crosshair}
  .side{border-inline-start:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;}
  .side h3{margin:0;padding:12px 14px 8px;font-size:13px;display:flex;align-items:center;gap:8px;} .side h3 small{color:var(--muted);font-weight:500;}
  .list{flex:1;overflow:auto;padding:0 8px 8px;}
  .mk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;padding:8px;border-radius:10px;border:1px solid transparent;}
  .mk:hover, .mk.on{background:var(--field);} .mk.on{border-color:var(--acc);}
  .mk i{width:14px;height:14px;border-radius:4px;} .mk input{height:26px;font-size:12px;width:100%;}
  .mk small{grid-column:2 / -1;color:var(--muted);font-size:11px;} .mk button{all:unset;cursor:pointer;color:var(--muted);font-size:16px;padding:0 4px;} .mk button:hover{color:var(--bad);}
  #layers details{border-bottom:1px solid var(--line);} #layers summary{cursor:pointer;padding:10px 14px;font-weight:800;font-size:12.5px;} #layers summary small{color:var(--muted);font-weight:500;}
  .lyl{max-height:180px;overflow:auto;padding:0 14px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px;direction:ltr;text-align:left;} .lyl label{display:flex;gap:6px;align-items:center;}
  .sum{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;display:flex;flex-direction:column;gap:6px;}
  .sum b{font-size:14px;}
  .hint{position:absolute;bottom:12px;right:12px;left:12px;margin:auto;width:max-content;max-width:calc(100% - 24px);background:rgba(20,26,34,.82);color:#fff;font-size:12px;padding:7px 14px;border-radius:99px;pointer-events:none;}
  .coords{position:absolute;top:10px;left:12px;font:600 11px/1 ui-monospace,monospace;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:5px 8px;border-radius:8px;direction:ltr;}
  .zoom{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;gap:4px;}
  .zoom button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--ink);}
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;}
  .empty[hidden]{display:none;}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;}
  .drop{border:2px dashed var(--line);border-radius:18px;padding:36px 30px;background:var(--surface);}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto 10px;} @keyframes sp{to{transform:rotate(360deg)}}
  .lab{font:700 11px Vazirmatn,Tahoma,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:3px;fill:var(--ink);}
  @media (max-width:760px){ .main{grid-template-columns:1fr;grid-template-rows:1fr auto;} .side{border:0;border-top:1px solid var(--line);max-height:38vh;} .top .nm b{max-width:60vw;} }
  /* گوشی: نوار ابزار افقی اسکرول می‌خورد (پیش‌تر عرض ۷۳۰px داشت و کل صفحه کوچک‌نمایی می‌شد) */
  @media (max-width:760px){
    html, body{overflow:hidden;overscroll-behavior:none;}
    .app{width:100vw;max-width:100vw;overflow:hidden;grid-template-columns:minmax(0,1fr);}
    .app > *{min-width:0;max-width:100vw;}
    .top{gap:6px;padding:6px 8px;}
    .top > *{min-width:0;}
    .top .seg, #tools{flex:1 0 100%;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .top .seg::-webkit-scrollbar, #tools::-webkit-scrollbar{display:none;}
    .top .seg button{flex:none;height:34px;padding:0 10px;}
    .top .btn, .top select, .top input[type=color]{height:32px;font-size:11.5px;}
    .top select{max-width:46vw;}
    .side{max-height:30vh;}
    .stage{min-height:0;}
  }
.pick{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 30px -12px rgba(0,0,0,.35);z-index:3;}
.pick[hidden]{display:none;} .pick b{font-size:12.5px;display:flex;flex-direction:column;} .pick b small{font-weight:500;color:var(--muted);font-size:10.5px;}
.pick span{display:flex;flex-direction:column;} .pick u{text-decoration:none;font-size:10.5px;color:var(--muted);} .pick em{font-style:normal;font-weight:800;font-size:15px;}
.lk{grid-column:1 / -1;display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;} .lk select{height:28px;font-size:11.5px;flex:1 1 120px;min-width:0;} .lk .btn{height:28px;font-size:11px;padding:0 9px;} .lk-ok{color:var(--ok) !important;font-weight:700;} .mk .lk .btn{color:#fff;font-size:11px;padding:0 9px;} .mk .lk .btn:hover{color:#fff;opacity:.9;}
.mk .lk-pick{all:unset;box-sizing:border-box;flex:1 1 100%;min-height:32px;padding:6px 10px;border-radius:9px;border:1px dashed var(--line);background:var(--surface);font-size:12px;color:var(--muted);cursor:pointer;line-height:1.5;}
.mk .lk-pick.on{border-style:solid;border-color:var(--acc);color:var(--ink);font-weight:700;}
.lk-k{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--field);} .mk .lk-k button{all:unset;cursor:pointer;padding:4px 10px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--muted);} .mk .lk-k button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
.lk-err{color:var(--bad) !important;font-weight:700;} .btn[disabled]{opacity:.5;cursor:default;}
#locPick{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.35);display:grid;place-items:center;padding:12px;}
.lp{width:min(420px,100%);max-height:min(560px,88vh);display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);overflow:hidden;}
.lp-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;} .lp-h button{all:unset;cursor:pointer;font-size:15px;color:var(--muted);padding:2px 6px;}
.lp-q{margin:4px 12px 8px;height:38px !important;border-radius:11px !important;}
.lp-l{overflow:auto;padding:0 10px 12px;} .lp-g{margin-top:8px;} .lp-g > b{display:block;font-size:11.5px;color:var(--muted);padding:4px 4px;}
.lp-g button{all:unset;box-sizing:border-box;display:block;width:100%;padding:9px 10px;border-radius:10px;font-size:13px;cursor:pointer;} .lp-g button:hover{background:var(--field);} .lp-g button.on{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);font-weight:800;}
.lp-0{color:var(--muted);text-align:center;padding:20px;}
.dbar{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 26px -10px rgba(0,0,0,.35);z-index:4;} .dbar[hidden]{display:none;} .dbar .btn{height:36px;padding:0 14px;}
.pbar{width:220px;height:6px;border-radius:99px;background:var(--field);margin:10px auto 0;overflow:hidden;} .pbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .15s;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
#orthoBtn.on{background:var(--acc);color:#fff;}
.mdl{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.38);display:grid;place-items:center;padding:12px;}
.mdl > div{width:min(520px,100%);max-height:min(640px,92vh);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.mdl h4{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;} .mdl h4 button{all:unset;cursor:pointer;color:var(--muted);font-size:15px;padding:2px 6px;}
.mdl .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 10px;} .mdl label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:700;}
.mdl label.tg{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-weight:600;} .mdl input[type=text], .mdl input[type=number], .mdl select{width:100%;}
.mdl .ft{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px;} .mdl small{color:var(--muted);font-size:11px;line-height:1.7;}
.mdl .pv{font:600 11.5px ui-monospace,monospace;direction:ltr;text-align:left;background:var(--field);border-radius:10px;padding:8px 10px;max-height:150px;overflow:auto;white-space:pre;}
.cnt-p{position:absolute;top:12px;left:12px;z-index:5;width:min(330px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px -14px rgba(0,0,0,.4);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12px;}
.cnt-p[hidden]{display:none;} .cnt-p b{font-size:12.5px;} .cnt-p .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;} .cnt-p .btn{height:30px;font-size:11.5px;}
.cnt-p small{color:var(--muted);} .cnt-p input{height:30px;font-size:12px;}
.cnt-p .cf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;} .cnt-p .cf label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--muted);min-width:0;}
.cnt-p .cf label:first-child{grid-column:1/-1;} .cnt-p .cf label.cf-c{grid-column:1/-1;} .cnt-p .cf label[hidden]{display:none;}
.cnt-p .cf :is(input,select){width:100%;min-width:0;height:30px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;padding:0 6px;}
.cnt-p small b[dir]{unicode-bidi:isolate;white-space:nowrap;font-family:ui-monospace,monospace;} .cnt-p .cf-pv{font-size:11px;color:var(--muted);background:color-mix(in srgb, var(--line) 35%, transparent);border-radius:8px;padding:6px 8px;} .cnt-p .cf-pv b{color:inherit;font-family:ui-monospace,monospace;font-size:12px;}
.cnt-p{max-height:calc(100% - 24px);overflow:auto;}
.lp-qk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 2px;font-size:12px;color:var(--muted);} .lp-qk select{height:32px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;padding:0 6px;max-width:46%;} .lp-qk .btn{height:32px;font-size:12px;} .lp-qn{font-size:11px;}
.mk .wl{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;} .mk .wl .btn{height:26px;font-size:11px;padding:0 9px;}
.lp-g label.lp-c{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:13px;cursor:pointer;} .lp-g label.lp-c:hover{background:var(--field);} .lp-g label.lp-c input{width:16px;height:16px;}
.lp-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line);} .lp-ft small{color:var(--muted);font-size:11px;}

/* انتخابگر محل (نسخهٔ دو ستونه) */
#locPick .lp.lp2{width:min(760px,100%);max-height:min(640px,90vh);height:min(640px,90vh);border-radius:18px;}
.lp2 .lp-h{padding:14px 16px 8px;gap:10px;} .lp2 .lp-ht{display:flex;flex-direction:column;gap:2px;} .lp2 .lp-ht b{font-size:15px;font-weight:800;} .lp2 .lp-ht small{font-size:11.5px;color:var(--muted);}
.lp2 .lp-x{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none;} .lp2 .lp-x:hover{color:inherit;background:var(--field);} .lp2 .lp-x svg{width:16px;height:16px;}
.lp2 .lp-sr{position:relative;margin:0 16px 8px;} .lp2 .lp-sr svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none;}
.lp2 .lp-sr .lp-q{margin:0 !important;width:100%;box-sizing:border-box;padding-inline-start:36px !important;}
.lp-qk2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 16px 10px;font-size:11.5px;color:var(--muted);}
.lp-qk2 > span{font-weight:700;margin-inline-end:2px;}
.lp-tg{all:unset;cursor:pointer;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:inherit;display:inline-flex;align-items:center;}
.lp-tg:hover{border-color:var(--acc);} .lp-tg.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.lp-qk2 select{height:28px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:inherit;padding:0 10px;}
.lp-qk2 .lp-qgo{height:28px;padding:0 12px;font-size:11.5px;} .lp-qk2 .lp-qgo b{font-weight:800;}
.lp-bd{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:190px minmax(0,1fr);border-top:1px solid var(--line);}
.lp-fl{overflow:auto;padding:8px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--field) 50%,var(--surface));}
.lp-fl button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:36px;padding:6px 10px;border-radius:10px;font-size:12.5px;}
.lp-fl button b{flex:1 1 auto;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lp-fl button em{font-style:normal;font-size:10.5px;color:var(--muted);} .lp-fl button i{font-style:normal;font-size:10px;font-weight:800;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;display:grid;place-items:center;background:var(--acc);color:#fff;}
.lp-fl button:hover{background:var(--field);} .lp-fl button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08), inset 0 0 0 1px color-mix(in srgb,var(--acc) 40%,var(--line));} .lp-fl button.on b{font-weight:800;color:var(--acc);}
.lp2 .lp-l{overflow:auto;padding:10px 14px 14px;}
.lp-g2 + .lp-g2{margin-top:14px;}
.lp-gh{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:sticky;top:-10px;background:var(--surface);padding:6px 0;z-index:1;} .lp-gh b{font-size:12.5px;font-weight:800;} .lp-gh small{font-size:11px;color:var(--muted);flex:1 1 auto;}
.lp-ga{all:unset;cursor:pointer;font-size:11px;font-weight:700;color:var(--acc);padding:3px 8px;border-radius:8px;} .lp-ga:hover{background:color-mix(in srgb,var(--acc) 10%,transparent);}
.lp-cs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;}
.lp-ci{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px;padding:7px 10px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;transition:border-color .15s,background-color .15s;}
.lp-ci:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));}
.lp-ci > i{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--muted) 60%,transparent);box-sizing:border-box;display:grid;place-items:center;}
.lp-ci > span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lp-ci > small{font-size:10px;color:var(--muted);flex:none;}
.lp-ci.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--surface));} .lp-ci.on > i{background:var(--acc);border-color:var(--acc);}
.lp-ci.on > i::after{content:'';width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);}
.lp-tray{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-top:1px solid var(--line);scrollbar-width:thin;}
.lp-tray[hidden]{display:none;}
.lp-pk{flex:none;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:999px;background:color-mix(in srgb,var(--acc) 12%,var(--surface));color:var(--acc);font-size:11.5px;font-weight:700;white-space:nowrap;}
.lp-pk button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:14px;} .lp-pk button:hover{background:color-mix(in srgb,var(--acc) 20%,transparent);}
.lp-pk.more{padding:0 10px;}
.lp2 .lp-ft{padding:10px 14px;} .lp2 .lp-fb{display:flex;gap:6px;}
@media (max-width:700px){
  #locPick{align-items:flex-end !important;padding:0 !important;}
  #locPick .lp.lp2{width:100%;height:92vh;max-height:92vh;border-radius:18px 18px 0 0;}
  .lp-bd{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);}
  .lp-fl{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px 10px;gap:6px;}
  .lp-fl button{flex:none;min-height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);}
  .lp-fl button b{overflow:visible;}
  .lp-cs{grid-template-columns:repeat(2,minmax(0,1fr));}
  .lp-ci{min-height:44px;}
}

/* انتخابگر محل نسخهٔ ۳: ردیف فیلترها و کاشی دوخطی */
.lp3 .lp-fx{display:flex;flex-direction:column;gap:6px;margin:0 16px 10px;}
.lp3 .lp-fr{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;} .lp3 .lp-fr::-webkit-scrollbar{display:none;}
.lp3 .lp-fr > span{flex:none;min-width:34px;font-size:11.5px;font-weight:700;color:var(--muted);}
.lp3 .lp-tg{flex:none;}
.lp3 .lp-cs{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}

<body>
<div class="app">
  <div class="top">
    <span class="nm"><b id="fname">نقشه‌خوان</b><small id="finfo">DWG و DXF · خط، محدوده، هاشور و مساحت</small></span>
    <div class="seg" id="tools">
      <button type="button" data-t="pan" class="on" title="جابه‌جایی (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>جابه‌جایی</button>
      <button type="button" data-t="line" title="خط (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg>خط</button>
      <button type="button" data-t="area" title="محدوده و مساحت (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7l7-3 9 5-3 10H6z"/></svg>محدوده</button>
      <button type="button" data-t="hatch" title="هاشور (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12l8-8M4 20L20 4M12 20l8-8"/></svg>هاشور</button>
      <button type="button" data-t="pline" title="چندخطی (P) — چند نقطه پشت سر هم"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-9 5 6 6-10"/></svg>چندخطی</button>
      <button type="button" data-t="cut" title="کسر از محدوده (X) — بخشی از محدودهٔ انتخاب‌شده را کم کنید"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="9" y="9" width="7" height="7" stroke-dasharray="2 2"/></svg>کسر</button>
      <button type="button" data-t="wall" title="کدگذاری دیوار (W) — چندخطی بکشید تا هر ضلع کد و طول بگیرد"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V8l8-4 8 4v12z"/><path d="M9 12h6M9 16h6"/></svg>دیوارها</button>
      <button type="button" data-t="count" title="شمارش آیتم (C) — روی یک آیتم (اسپرینکلر، دتکتور، …) بزنید"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="7" cy="17" r="2.5"/><path d="M15 17h5M17.5 14.5v5"/></svg>شمارش</button>
      <button type="button" data-t="measure" title="اندازه‌گیری (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>اندازه</button>
    </div>
    <select id="hpat" title="الگوی هاشور"><option value="diag">هاشور مورب</option><option value="cross">هاشور ضربدری</option><option value="dots">نقطه‌ای</option><option value="solid">توپر</option></select>
    <input type="color" id="col" value="#2f6f9f" title="رنگ" style="width:36px;height:32px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--surface)">
    <select id="unit" title="واحد نقشه"><option value="1000">واحد نقشه: میلی‌متر</option><option value="100">سانتی‌متر</option><option value="1">متر</option></select>
    <button type="button" class="btn" id="openBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>باز کردن</button>
    <button type="button" class="btn" id="orthoBtn" title="عمود (F8 یا O): خط‌ها فقط افقی و عمودی">⊥ عمود</button>

  </div>
  <div class="main">
    <div class="stage t-pan" id="stage">
      <svg id="view" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="p-diag" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--pc)" stroke-width="1.6"/></pattern>
        </defs>
        <g id="world" transform="scale(1,-1)"><g id="dwg"></g><g id="mk"></g><g id="tmp"></g></g>
      </svg>
      <div class="coords" id="coords" hidden></div>
      <div class="zoom"><button type="button" id="zin">+</button><button type="button" id="zout">−</button><button type="button" id="zfit" title="کل نقشه" style="font-size:12px">⤢</button></div>
      <div class="empty" id="empty"><div class="drop"><b>فایل DWG یا DXF را اینجا رها کنید</b>یا «باز کردن» را بزنید.<br><small>فایل روی همین دستگاه خوانده می‌شود و جایی فرستاده نمی‌شود.</small></div></div>
      <div class="hint" id="hint" hidden></div>
      <div class="pick" id="pick" hidden></div>
    </div>
    <aside class="side">
      <div id="layers"></div>
      <h3>محدوده‌ها و اندازه‌ها <small id="cnt"></small></h3>
      <div class="list" id="list"></div>
      <div class="sum" id="sum"></div>
    </aside>
  </div>
</div>
<script type="module">
const $ = s => document.querySelector(s);
const FA = '۰۱۲۳۴۵۶۷۸۹', toFa = v => String(v).replace(/\d/g, d => FA[d]);
const fmt = (v, d) => toFa((+v).toLocaleString('en-US', {maximumFractionDigits: d == null ? 2 : d}));
const stage = $('#stage'), view = $('#view'), world = $('#world'), dwgG = $('#dwg'), mkG = $('#mk'), tmpG = $('#tmp');
const NS = 'http://www.w3.org/2000/svg';
const S = {tool: 'pan', vb: {x: 0, y: 0, w: 1000, h: 1000}, file: '', key: '', marks: [], cur: null, sel: -1, snaps: [], snapCell: 0, grid: new Map(), flipY: -1};
try{ const th = new URLSearchParams(location.search).get('theme'); if(th) document.documentElement.dataset.theme = th; }catch(e){}

/* ---------- خواندن فایل ----------
   DWG با LibreDWG (WebAssembly، داخل سایت: lib/libredwg) و DXF با خوانندهٔ سادهٔ همین صفحه؛
   هر دو به یک ساختار «موجودیت» می‌رسند و این صفحه خودش آن‌ها را به SVG می‌کشد (لایه‌ها، بلاک‌ها، متن، هاشور). */
let LDWG = null;
async function lib(){
  if(LDWG) return LDWG;
  const m = await import('./lib/libredwg/dist/libredwg-web.js');
  LDWG = {m, lib: await m.LibreDwg.create('./lib/libredwg/wasm')};
  return LDWG;
}
function busy(t){ $('#empty').hidden = false; $('#empty').innerHTML = '<div><div class="spin"></div>' + t + '</div>'; }
async function openBuffer(buf, name){
  S.file = name || 'نقشه'; S.key = 'cad.mk:' + S.file; $('#fname').textContent = S.file;
  busy('در حال خواندن نقشه…');
  await new Promise(r => setTimeout(r, 30));
  try{
    const out = await readInWorker(buf);
    showDb(out);
    $('#finfo').textContent = toFa(S.nEnt) + ' موجودیت · ' + toFa(S.layers.size) + ' لایه' + (out.head.slice(0, 2) === 'AC' ? ' · ' + out.head : ' · DXF');
    $('#empty').hidden = true;
    fit(); loadMarks();
  }catch(err){
    console.error(err);
    $('#empty').hidden = false; $('#empty').innerHTML = '<div class="drop"><b>این فایل خوانده نشد</b>' + (/noworker/.test(String(err)) ? 'این مرورگر نمی‌تواند نقشه را در پس‌زمینه بخواند؛ مرورگر را به‌روز کنید یا فایل را دانلود کنید و با اتوکد یا برنامهٔ نقشه باز کنید.' : /memory|wasm|fetch|import|module/i.test(String(err)) ? 'خوانندهٔ نقشه روی این دستگاه بار نشد (حافظه یا اتصال)؛ دوباره امتحان کنید یا فایل را دانلود کنید.' : 'شاید نسخهٔ فایل پشتیبانی نشود؛ آن را در اتوکد با «Save As» به DWG 2018 یا DXF ذخیره کنید.') + '</div>';
  }
}
/* خواندن و ساختن نقشه در Worker (صفحه یخ نمی‌زند)؛ اگر Worker نشد، همین‌جا */
let WK = null, wkId = 0;
/* هر فایل با Worker تازه خوانده می‌شود و پس از آن بسته می‌شود: حافظهٔ WebAssembly کوچک نمی‌شود و
   روی گوشی بار دوم جا کم می‌آورد؛ اگر خواندن شکست خورد، یک بار دیگر با Worker تازه */
async function readInWorker(buf){
  const copy = buf.slice(0);
  try{ return await readOnce(buf); }
  catch(err){ if(/noworker/.test(String(err))) throw err; return await readOnce(copy); }
}
/* هر فایل با Worker تازه خوانده و بعد بسته می‌شود (حافظهٔ WebAssembly کامل آزاد می‌شود)؛ خوانندهٔ کامپایل‌شده
   (WebAssembly.Module) را صفحه نگه می‌دارد و به Worker بعدی می‌دهد، پس بار دوم دوباره کامپایل نمی‌شود */
let WMOD = null;
function readOnce(buf){
  try{ if(WK) WK.terminate(); }catch(e){} WK = null;
  return new Promise((res, rej) => {
    try{ WK = new Worker(new URL('./lib/cad-worker.js', location.href), {type: 'module'}); if(WMOD) WK.postMessage({mod: WMOD}); }catch(e){ WK = null; }
    /* بی Worker، DWG روی همین صفحه خوانده نمی‌شود (گوشی یخ می‌زد)؛ DXF کوچک اشکالی ندارد */
    const isDwg = /^AC10/.test(new TextDecoder().decode(new Uint8Array(buf).slice(0, 6)));
    const here = () => (isDwg || buf.byteLength > 4e6) ? Promise.reject(new Error('noworker')) : readHere(buf);
    if(!WK) return here().then(res, rej);
    const id = ++wkId;
    const on = e => { const d = e.data || {}; if(d.wasmMod){ WMOD = d.wasmMod; return; } if(d.id !== id && !d.fatal) return;
      if(d.fatal){ WK.removeEventListener('message', on); try{ WK.terminate(); }catch(e){} WK = null; rej(new Error('wasm ' + d.fatal)); return; }
      if(d.stage){ busy(d.stage === 'dl' ? 'دریافت خوانندهٔ نقشه… <b>' + toFa(d.p || 0) + '٪</b><div class="pbar"><i style="width:' + (d.p || 0) + '%"></i></div><small style="display:block;opacity:.7;margin-top:4px">فقط بار اول (حدود ۱۰ مگابایت)</small>'
        : d.stage === 'dwg' ? 'در حال خواندن DWG…' : 'در حال ساختن نقشه…'); return; }
      WK.removeEventListener('message', on); WK.removeEventListener('error', er);
      try{ WK.terminate(); }catch(e){} WK = null;
      if(d.ok) res(d); else rej(new Error(d.err)); };
    const er = ev => { WK.removeEventListener('message', on); WK.removeEventListener('error', er); try{ WK.terminate(); }catch(e){} WK = null; here().then(res, rej); ev.preventDefault && ev.preventDefault(); };
    WK.addEventListener('message', on); WK.addEventListener('error', er);
    WK.postMessage({buf, id}, [buf]);
  });
}
async function readHere(buf){
  const core = await import('./lib/cad-core.js');
  const head = new TextDecoder().decode(new Uint8Array(buf).slice(0, 6));
  let db;
  if(/^AC10/.test(head)){ const {m, lib: L} = await lib(); const data = L.dwg_read_data(buf, m.Dwg_File_Type.DWG); if(!data) throw new Error('read'); db = L.convert(data); try{ L.dwg_free(data); }catch(e){} }
  else db = core.parseDxf(new TextDecoder('utf-8').decode(buf));
  const out = core.buildDb(db); return Object.assign(out, {head});
}
/* نقشهٔ پایه روی Canvas (ده‌ها هزار خط بی کندی)؛ نشانه‌ها همچنان SVG روی آن */
const cv = document.createElement('canvas'); cv.id = 'cv'; stage.insertBefore(cv, view);
/* کشیدن در Worker جدا (OffscreenCanvas) تا صفحه و مرورگر درگیر نشوند؛ مرورگر بی پشتیبانی: همین‌جا */
let RW = null;
try{ if(cv.transferControlToOffscreen && window.OffscreenCanvas && window.Path2D && new URLSearchParams(location.search).get('rw') !== '0'){
  RW = new Worker(new URL('./lib/cad-render.js', location.href), {type: 'module'}); const off = cv.transferControlToOffscreen(); RW.postMessage({init: 1, canvas: off}, [off]);
  RW.addEventListener('error', () => { RW = null; });
} }catch(e){ RW = null; }
const RWQ = new Map(); let rwId = 0;
if(RW) RW.addEventListener('message', e => { const d = e.data || {}; const k = d.thumb || d.png; if(k && RWQ.has(k)){ RWQ.get(k)(d); RWQ.delete(k); } });
const rwAsk = msg => new Promise(r => { const id = ++rwId; RWQ.set(id, r); const key = Object.keys(msg)[0]; msg[key].id = id; RW.postMessage(msg); });
const cx = RW ? null : cv.getContext('2d'), shot = document.createElement('canvas'), sx = shot.getContext('2d');
const layersOff = () => { const o = {}; (S.layers || new Map()).forEach((v, k) => { if(v === false) o[k] = 1; }); return o; };
const dprOf = () => Math.min(S.big ? 1.25 : 2, window.devicePixelRatio || 1);
let rwRaf = 0, rwFull = false;
function rwView(full){ rwFull = rwFull || full; if(rwRaf) return; rwRaf = requestAnimationFrame(() => { rwRaf = 0; const f = rwFull; rwFull = false;
  RW.postMessage({view: {vb: Object.assign({}, S.vb), W: stage.clientWidth || 1, H: stage.clientHeight || 1, dpr: dprOf(), off: layersOff(), full: f}}); }); }
let DB = null, shotVB = null, rT = 0;
function showDb(out){
  S.nEnt = out.n; S.layers = new Map(out.layers.map(l => [l.ly, true]));
  if(RW){ DB = true; RW.postMessage({data: out.layers, colors: {'var(--draw)': colOf('var(--draw)')}}); }
  else DB = out.layers.map(l => ({ly: l.ly, st: l.st.map(([c, L]) => [c, L.map(([d, b]) => ({P: new Path2D(d), b}))]), fill: l.fill.map(([d, c, op, b]) => [new Path2D(d), c, op, b]), tx: l.tx}));
  S.big = out.n > 25000;
  dwgG.innerHTML = '';
  const F = out.snaps, sn = new Array(F.length / 2); for(let k = 0; k < sn.length; k++) sn[k] = [F[k * 2], F[k * 2 + 1]];
  S.regions = (out.regions || []).map(g => Object.assign(g, {r: g.r.map(F => { const o = []; for(let k = 0; k < F.length; k += 2) o.push([F[k], F[k + 1]]); return o; })})); pickClear();
  S.ins = out.ins || null; insIndex();
  S.snaps = sn; S.bounds = out.bounds; S.base = out.bounds ? {x: out.bounds.x0, y: -out.bounds.y1, w: out.bounds.x1 - out.bounds.x0 || 1, h: out.bounds.y1 - out.bounds.y0 || 1} : null;
  layerList(); index();
}
const colOf = c => c && c.indexOf('var(') === 0 ? (getComputedStyle(document.documentElement).getPropertyValue(c.slice(4, -1)).trim() || '#333') : c;
/* کشیدن لایه‌ها روی هر بوم با هر نما (نمای اصلی و تصویر کوچک ریز محل) */
function paint(ctx, v, W, H, dpr, minTx, noFill){
  const k = W / v.w;
  ctx.setTransform(k * dpr, 0, 0, -k * dpr, -v.x * k * dpr, -v.y * k * dpr);
  ctx.lineWidth = 1 / k; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const tx = [];
  /* فقط تکه‌هایی که در دیدند و دست‌کم نیم پیکسل‌اند کشیده می‌شوند */
  const X0 = v.x, X1 = v.x + v.w, Y0 = -(v.y + v.h), Y1 = -v.y, tiny = .6 / k;
  const vis = b => !b || (b[2] >= X0 && b[0] <= X1 && b[3] >= Y0 && b[1] <= Y1 && (b[2] - b[0] > tiny || b[3] - b[1] > tiny));
  DB.forEach(L => { if(S.layers.get(L.ly) === false) return;
    if(!noFill) L.fill.forEach(([P, c, op, b]) => { if(!vis(b)) return; ctx.globalAlpha = op; ctx.fillStyle = colOf(c); ctx.fill(P, 'evenodd'); });
    ctx.globalAlpha = 1;
    L.st.forEach(([c, K]) => { ctx.strokeStyle = colOf(c); for(let i = 0; i < K.length; i++){ if(vis(K[i].b)) ctx.stroke(K[i].P); } });
    L.tx.forEach(t => tx.push(t)); });
  /* متن در فضای صفحه (اندازهٔ واقعی پیکسل)؛ متن‌های خیلی ریز کشیده نمی‌شوند */
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1;
  tx.forEach(([x, y, h, rot, str, c, top]) => { const ph = h * k; if(ph < (minTx || 4)) return; const X = (x - v.x) * k, Y = (-y - v.y) * k;
    if(X < -2000 || X > W + 2000 || Y < -2000 || Y > H + 2000) return;
    ctx.save(); ctx.translate(X, Y); ctx.rotate(-rot); ctx.fillStyle = colOf(c); ctx.font = ph.toFixed(1) + 'px Vazirmatn,Tahoma,sans-serif'; ctx.textBaseline = top ? 'top' : 'alphabetic';
    String(str).split('\n').forEach((ln, i) => ctx.fillText(ln, 0, i * ph * 1.35)); ctx.restore(); });
}
function fullDraw(){
  if(RW){ rwView(true); return; }
  rT = 0;
  const W = stage.clientWidth || 1, H = stage.clientHeight || 1, dpr = dprOf();
  if(cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)){ cv.width = shot.width = Math.round(W * dpr); cv.height = shot.height = Math.round(H * dpr); }
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height);
  if(!DB) return;
  paint(cx, S.vb, W, H, dpr);
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.clearRect(0, 0, shot.width, shot.height); sx.drawImage(cv, 0, 0); shotVB = Object.assign({}, S.vb);
}
/* تصویر کوچک یک ریز محل: همان بخش نقشه با محدودهٔ پررنگ (JPEG سبک برای کارت فضا) */
async function thumbAsync(pts, color, holes){
  if(RW){ const r = await rwAsk({thumb: {pts: pts.map(p => ({x: p.x, y: p.y})), holes: (holes || []).map(h => h.map(p => ({x: p.x, y: p.y}))), color, light: {'var(--draw)': '#1d2430'}}}); return r.url; }
  return thumbOf(pts, color, holes);
}
function thumbOf(pts, color, holes){
  const W = 480, H = 320; let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
  let w = (x1 - x0) || 1, h = (y1 - y0) || 1; const pad = .35; w *= 1 + pad * 2; h *= 1 + pad * 2;
  if(w / h > W / H) h = w * H / W; else w = h * W / H;
  const v = {x: (x0 + x1) / 2 - w / 2, y: -((y0 + y1) / 2) - h / 2, w, h};
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');

function insNear(w){ if(!CI) return -1; const tol = 14 * S.vb.w / (stage.clientWidth || 1), r = Math.ceil(tol / CI.cell), cx = Math.floor(w.x / CI.cell), cy = Math.floor(w.y / CI.cell); let best = -1, bd = tol;

const pip = (x, y, pts) => { let o = false; for(let a = 0, b = pts.length - 1; a < pts.length; b = a++){ const P = pts[a], Q = pts[b]; if((P.y > y) !== (Q.y > y) && x < (Q.x - P.x) * (y - P.y) / (Q.y - P.y) + P.x) o = !o; } return o; };
cntP.addEventListener('click', e => {
  if(e.target.closest('[data-cx]')){ cntP.hidden = true; S.cg = -1; tmpG.innerHTML = ''; render(); return; }

    const c = cntRead('cc'), cat = c.cat || 'آیتم', pre = cntPre(c), ord = (cntP.querySelector('[data-cc="ord"]') || {}).value || 'yx'; cntSaveCfg(c);

    const P = L.map(j => ({x: I.xy[j * 2], y: I.xy[j * 2 + 1], b: I.nm[j]}));

    P.sort((a, b) => ord === 'xy' ? (Math.round(a.x / tol) - Math.round(b.x / tol) || b.y - a.y) : (Math.round(b.y / tol) - Math.round(a.y / tol) || (ord === 'rtl' ? b.x - a.x : a.x - b.x)));
    const m = {type: 'count', cat, pre, start: c.start, dg: c.dg, sc: c, blk: Sm.nm || '', color: '#c0392b', name: cat, items: [], man: how === 'manual' ? 1 : 0};
    P.forEach((it, n) => m.items.push(Object.assign(it, {c: cntCode(m, c.start + n)})));
    S.marks.push(m); S.sel = S.cg = S.marks.length - 1; save(); render(); cntOpen(S.cg); return; }
  const ok = e.target.closest('[data-cok]'); if(ok){ const m = S.marks[S.cg]; if(m){ const c = cntRead('cg'), np = cntPre(c);
      m.cat = c.cat || m.cat; m.name = m.cat; m.sc = c; m.start = c.start;
      const old = m.pre || '', dg = +m.dg || 3;
      if(np !== old || c.dg !== dg){ m.items.forEach(it => { const t = String(it.c); if(t.indexOf(old) === 0){ const n = parseInt(t.slice(old.length), 10); it.c = np + (isNaN(n) ? t.slice(old.length) : String(n).padStart(c.dg, '0')); } }); m.pre = np; m.dg = c.dg; }

});
cntP.addEventListener('change', e => { const t = e.target;

cntP.addEventListener('keydown', e => e.stopPropagation());

function rowXHtml(m, i){

function markExtra(m){
