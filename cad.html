<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نقشه‌خوان</title>
<style>
  :root{--bg:#f4f5f7;--surface:#fff;--field:#eef0f3;--line:#e2e5ea;--ink:#1d2430;--muted:#6b7586;--acc:#2f6f9f;--ok:#3f8a62;--bad:#c0392b;--paper:#fbfbfc;--draw:#1d2430;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#11151b;--surface:#181d25;--field:#222833;--line:#2c3440;--ink:#e6e9ee;--muted:#9aa3b1;--paper:#0f1318;--draw:#d7dce3;} }
  :root[data-theme="dark"]{--bg:#11151b;--surface:#181d25;--field:#222833;--line:#2c3440;--ink:#e6e9ee;--muted:#9aa3b1;--paper:#0f1318;--draw:#d7dce3;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"IRANSans",Tahoma,sans-serif;font-size:13px;}
  .app{display:grid;grid-template-rows:auto 1fr;height:100%;}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);}
  .top .nm{display:flex;flex-direction:column;min-width:0;margin-inline-end:auto;} .top .nm b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;} .top .nm small{color:var(--muted);font-size:11px;}
  .seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--field);}
  .seg button, .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .seg button:hover, .btn:hover{color:var(--ink);} .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .seg button svg, .btn svg{width:16px;height:16px;}
  .btn{background:var(--field);} .btn.pri{background:var(--acc);color:#fff;}
  select, input[type=text], input[type=number]{font:inherit;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 8px;}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:0;}
  .stage{position:relative;overflow:hidden;background:var(--paper);touch-action:none;}
  .stage svg#view{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #dwg *{vector-effect:non-scaling-stroke;}
  #dwg [stroke="#000000"], #dwg [stroke="black"], #dwg [stroke="rgb(0,0,0)"]{stroke:var(--draw);}
  #dwg [fill="#000000"]:not(path), #dwg text[fill="#000000"]{fill:var(--draw);}
  .stage.t-pan{cursor:grab} .stage.t-pan.drag{cursor:grabbing} .stage:not(.t-pan){cursor:crosshair}
  .side{border-inline-start:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;}
  .side h3{margin:0;padding:12px 14px 8px;font-size:13px;display:flex;align-items:center;gap:8px;} .side h3 small{color:var(--muted);font-weight:500;}
  .list{flex:1;overflow:auto;padding:0 8px 8px;}
  .mk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;padding:8px;border-radius:10px;border:1px solid transparent;}
  .mk:hover, .mk.on{background:var(--field);} .mk.on{border-color:var(--acc);}
  .mk i{width:14px;height:14px;border-radius:4px;} .mk input{height:26px;font-size:12px;width:100%;}
  .mk small{grid-column:2 / -1;color:var(--muted);font-size:11px;} .mk button{all:unset;cursor:pointer;color:var(--muted);font-size:16px;padding:0 4px;} .mk button:hover{color:var(--bad);}
  #layers details{border-bottom:1px solid var(--line);} #layers summary{cursor:pointer;padding:10px 14px;font-weight:800;font-size:12.5px;} #layers summary small{color:var(--muted);font-weight:500;}
  .lyl{max-height:180px;overflow:auto;padding:0 14px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px;direction:ltr;text-align:left;} .lyl label{display:flex;gap:6px;align-items:center;}
  .sum{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;display:flex;flex-direction:column;gap:6px;}
  .sum b{font-size:14px;}
  .hint{position:absolute;bottom:12px;right:12px;left:12px;margin:auto;width:max-content;max-width:calc(100% - 24px);background:rgba(20,26,34,.82);color:#fff;font-size:12px;padding:7px 14px;border-radius:99px;pointer-events:none;}
  .coords{position:absolute;top:10px;left:12px;font:600 11px/1 ui-monospace,monospace;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:5px 8px;border-radius:8px;direction:ltr;}
  .zoom{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;gap:4px;}
  .zoom button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--ink);}
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;}
  .empty[hidden]{display:none;}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;}
  .drop{border:2px dashed var(--line);border-radius:18px;padding:36px 30px;background:var(--surface);}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto 10px;} @keyframes sp{to{transform:rotate(360deg)}}
  .lab{font:700 11px Vazirmatn,Tahoma,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:3px;fill:var(--ink);}
  @media (max-width:760px){ .main{grid-template-columns:1fr;grid-template-rows:1fr auto;} .side{border:0;border-top:1px solid var(--line);max-height:38vh;} .top .nm b{max-width:60vw;} }
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="nm"><b id="fname">نقشه‌خوان</b><small id="finfo">DWG و DXF · خط، محدوده، هاشور و مساحت</small></span>
    <div class="seg" id="tools">
      <button type="button" data-t="pan" class="on" title="جابه‌جایی (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>جابه‌جایی</button>
      <button type="button" data-t="line" title="خط (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg>خط</button>
      <button type="button" data-t="area" title="محدوده و مساحت (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7l7-3 9 5-3 10H6z"/></svg>محدوده</button>
      <button type="button" data-t="hatch" title="هاشور (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12l8-8M4 20L20 4M12 20l8-8"/></svg>هاشور</button>
      <button type="button" data-t="measure" title="اندازه‌گیری (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>اندازه</button>
    </div>
    <select id="hpat" title="الگوی هاشور"><option value="diag">هاشور مورب</option><option value="cross">هاشور ضربدری</option><option value="dots">نقطه‌ای</option><option value="solid">توپر</option></select>
    <input type="color" id="col" value="#2f6f9f" title="رنگ" style="width:36px;height:32px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--surface)">
    <select id="unit" title="واحد نقشه"><option value="1000">واحد نقشه: میلی‌متر</option><option value="100">سانتی‌متر</option><option value="1">متر</option></select>
    <button type="button" class="btn" id="openBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>باز کردن</button>
    <button type="button" class="btn" id="pngBtn" title="خروجی تصویر">PNG</button>
    <input type="file" id="file" accept=".dwg,.dxf" hidden>
  </div>
  <div class="main">
    <div class="stage t-pan" id="stage">
      <svg id="view" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="p-diag" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--pc)" stroke-width="1.6"/></pattern>
        </defs>
        <g id="world" transform="scale(1,-1)"><g id="dwg"></g><g id="mk"></g><g id="tmp"></g></g>
      </svg>
      <div class="coords" id="coords" hidden></div>
      <div class="zoom"><button type="button" id="zin">+</button><button type="button" id="zout">−</button><button type="button" id="zfit" title="کل نقشه" style="font-size:12px">⤢</button></div>
      <div class="empty" id="empty"><div class="drop"><b>فایل DWG یا DXF را اینجا رها کنید</b>یا «باز کردن» را بزنید.<br><small>فایل روی همین دستگاه خوانده می‌شود و جایی فرستاده نمی‌شود.</small></div></div>
      <div class="hint" id="hint" hidden></div>
    </div>
    <aside class="side">
      <div id="layers"></div>
      <h3>محدوده‌ها و اندازه‌ها <small id="cnt"></small></h3>
      <div class="list" id="list"></div>
      <div class="sum" id="sum"></div>
    </aside>
  </div>
</div>
<script type="module">
const $ = s => document.querySelector(s);
const FA = '۰۱۲۳۴۵۶۷۸۹', toFa = v => String(v).replace(/\d/g, d => FA[d]);
const fmt = (v, d) => toFa((+v).toLocaleString('en-US', {maximumFractionDigits: d == null ? 2 : d}));
const stage = $('#stage'), view = $('#view'), world = $('#world'), dwgG = $('#dwg'), mkG = $('#mk'), tmpG = $('#tmp');
const NS = 'http://www.w3.org/2000/svg';
const S = {tool: 'pan', vb: {x: 0, y: 0, w: 1000, h: 1000}, file: '', key: '', marks: [], cur: null, sel: -1, snaps: [], snapCell: 0, grid: new Map(), flipY: -1};
try{ const th = new URLSearchParams(location.search).get('theme'); if(th) document.documentElement.dataset.theme = th; }catch(e){}

/* ---------- خواندن فایل ----------
   DWG با LibreDWG (WebAssembly، داخل سایت: lib/libredwg) و DXF با خوانندهٔ سادهٔ همین صفحه؛
   هر دو به یک ساختار «موجودیت» می‌رسند و این صفحه خودش آن‌ها را به SVG می‌کشد (لایه‌ها، بلاک‌ها، متن، هاشور). */
let LDWG = null;
async function lib(){
  if(LDWG) return LDWG;
  const m = await import('./lib/libredwg/dist/libredwg-web.js');
  LDWG = {m, lib: await m.LibreDwg.create('./lib/libredwg/wasm')};
  return LDWG;
}
function busy(t){ $('#empty').hidden = false; $('#empty').innerHTML = '<div><div class="spin"></div>' + t + '</div>'; }
async function openBuffer(buf, name){
  S.file = name || 'نقشه'; S.key = 'cad.mk:' + S.file; $('#fname').textContent = S.file;
  busy('در حال خواندن نقشه…');
  await new Promise(r => setTimeout(r, 30));
  try{
    const out = await readInWorker(buf);
    showDb(out);
    $('#finfo').textContent = toFa(S.nEnt) + ' موجودیت · ' + toFa(S.layers.size) + ' لایه' + (out.head.slice(0, 2) === 'AC' ? ' · ' + out.head : ' · DXF');
    $('#empty').hidden = true;
    fit(); loadMarks();
  }catch(err){
    console.error(err);
    $('#empty').hidden = false; $('#empty').innerHTML = '<div class="drop"><b>این فایل خوانده نشد</b>' + (/noworker/.test(String(err)) ? 'این مرورگر نمی‌تواند نقشه را در پس‌زمینه بخواند؛ مرورگر را به‌روز کنید یا فایل را دانلود کنید و با اتوکد یا برنامهٔ نقشه باز کنید.' : /memory|wasm|fetch|import|module/i.test(String(err)) ? 'خوانندهٔ نقشه روی این دستگاه بار نشد (حافظه یا اتصال)؛ دوباره امتحان کنید یا فایل را دانلود کنید.' : 'شاید نسخهٔ فایل پشتیبانی نشود؛ آن را در اتوکد با «Save As» به DWG 2018 یا DXF ذخیره کنید.') + '</div>';
  }
}
/* خواندن و ساختن نقشه در Worker (صفحه یخ نمی‌زند)؛ اگر Worker نشد، همین‌جا */
let WK = null, wkId = 0;
function readInWorker(buf){
  return new Promise((res, rej) => {
    try{ if(!WK) WK = new Worker(new URL('./lib/cad-worker.js', location.href), {type: 'module'}); }catch(e){ WK = null; }
    /* بی Worker، DWG روی همین صفحه خوانده نمی‌شود (گوشی یخ می‌زد)؛ DXF کوچک اشکالی ندارد */
    const isDwg = /^AC10/.test(new TextDecoder().decode(new Uint8Array(buf).slice(0, 6)));
    const here = () => (isDwg || buf.byteLength > 4e6) ? Promise.reject(new Error('noworker')) : readHere(buf);
    if(!WK) return here().then(res, rej);
    const id = ++wkId;
    const on = e => { const d = e.data || {}; if(d.id !== id) return;
      if(d.stage){ busy(d.stage === 'dwg' ? 'در حال خواندن DWG…<small style="display:block;opacity:.7;margin-top:4px">بار اول خوانندهٔ نقشه (حدود ۱۰ مگابایت) دریافت می‌شود</small>' : 'در حال ساختن نقشه…'); return; }
      WK.removeEventListener('message', on); WK.removeEventListener('error', er);
      if(d.ok) res(d); else rej(new Error(d.err)); };
    const er = ev => { WK.removeEventListener('message', on); WK.removeEventListener('error', er); try{ WK.terminate(); }catch(e){} WK = null; here().then(res, rej); ev.preventDefault && ev.preventDefault(); };
    WK.addEventListener('message', on); WK.addEventListener('error', er);
    WK.postMessage({buf, id});
  });
}
async function readHere(buf){
  const core = await import('./lib/cad-core.js');
  const head = new TextDecoder().decode(new Uint8Array(buf).slice(0, 6));
  let db;
  if(/^AC10/.test(head)){ const {m, lib: L} = await lib(); const data = L.dwg_read_data(buf, m.Dwg_File_Type.DWG); if(!data) throw new Error('read'); db = L.convert(data); try{ L.dwg_free(data); }catch(e){} }
  else db = core.parseDxf(new TextDecoder('utf-8').decode(buf));
  const out = core.buildDb(db); return Object.assign(out, {head});
}
/* نقشهٔ پایه روی Canvas (ده‌ها هزار خط بی کندی)؛ نشانه‌ها همچنان SVG روی آن */
const cv = document.createElement('canvas'); cv.id = 'cv'; stage.insertBefore(cv, view);
const cx = cv.getContext('2d'), shot = document.createElement('canvas'), sx = shot.getContext('2d');
let DB = null, shotVB = null, rT = 0;
function showDb(out){
  S.nEnt = out.n; S.layers = new Map(out.layers.map(l => [l.ly, true]));
  DB = out.layers.map(l => ({ly: l.ly, st: l.st.map(([c, d]) => [c, new Path2D(d)]), fill: l.fill.map(([d, c, op]) => [new Path2D(d), c, op]), tx: l.tx}));
  dwgG.innerHTML = '';
  const F = out.snaps, sn = new Array(F.length / 2); for(let k = 0; k < sn.length; k++) sn[k] = [F[k * 2], F[k * 2 + 1]];
  S.snaps = sn; S.bounds = out.bounds; S.base = out.bounds ? {x: out.bounds.x0, y: -out.bounds.y1, w: out.bounds.x1 - out.bounds.x0 || 1, h: out.bounds.y1 - out.bounds.y0 || 1} : null;
  layerList(); index();
}
const colOf = c => c && c.indexOf('var(') === 0 ? (getComputedStyle(document.documentElement).getPropertyValue(c.slice(4, -1)).trim() || '#333') : c;
function fullDraw(){
  rT = 0;
  const W = stage.clientWidth || 1, H = stage.clientHeight || 1, dpr = Math.min(2, window.devicePixelRatio || 1);
  if(cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)){ cv.width = shot.width = Math.round(W * dpr); cv.height = shot.height = Math.round(H * dpr); }
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height);
  if(!DB) return;
  const v = S.vb, k = W / v.w;
  cx.setTransform(k * dpr, 0, 0, -k * dpr, -v.x * k * dpr, -v.y * k * dpr);
  cx.lineWidth = 1 / k; cx.lineJoin = 'round'; cx.lineCap = 'round';
  const tx = [];
  DB.forEach(L => { if(S.layers.get(L.ly) === false) return;
    L.fill.forEach(([P, c, op]) => { cx.globalAlpha = op; cx.fillStyle = colOf(c); cx.fill(P, 'evenodd'); });
    cx.globalAlpha = 1;
    L.st.forEach(([c, P]) => { cx.strokeStyle = colOf(c); cx.stroke(P); });
    L.tx.forEach(t => tx.push(t)); });
  /* متن در فضای صفحه (اندازهٔ واقعی پیکسل)؛ متن‌های ریزتر از ۴ پیکسل کشیده نمی‌شوند */
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.globalAlpha = 1;
  tx.forEach(([x, y, h, rot, str, c, top]) => { const ph = h * k; if(ph < 4) return; const X = (x - v.x) * k, Y = (-y - v.y) * k;
    if(X < -2000 || X > W + 2000 || Y < -2000 || Y > H + 2000) return;
    cx.save(); cx.translate(X, Y); cx.rotate(-rot); cx.fillStyle = colOf(c); cx.font = ph.toFixed(1) + 'px Vazirmatn,Tahoma,sans-serif'; cx.textBaseline = top ? 'top' : 'alphabetic';
    String(str).split('\n').forEach((ln, i) => cx.fillText(ln, 0, i * ph * 1.35)); cx.restore(); });
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.clearRect(0, 0, shot.width, shot.height); sx.drawImage(cv, 0, 0); shotVB = Object.assign({}, v);
}
/* حین حرکت: همان تصویر آخر جابه‌جا/بزرگ می‌شود؛ پس از ایستادن، کشیدن کامل */
function quickDraw(){
  if(!shotVB){ fullDraw(); return; }
  const v = S.vb, W = stage.clientWidth || 1, H = stage.clientHeight || 1, dpr = cv.width / W, s2 = shotVB.w / v.w;
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height);
  cx.drawImage(shot, (shotVB.x - v.x) / v.w * W * dpr, (shotVB.y - v.y) / v.h * H * dpr, shot.width * s2, shot.height * s2);
  clearTimeout(rT); rT = setTimeout(fullDraw, 140);
}

function layerList(){ const box = $('#layers'); if(!box) return; const L = Array.from(S.layers.keys()).sort();
  box.innerHTML = L.length > 1 ? '<details><summary>لایه‌ها <small>' + toFa(L.length) + '</small></summary><div class="lyl">' + L.map(l => '<label><input type="checkbox" data-ly="' + l.replace(/"/g, '&quot;') + '" checked> ' + l.replace(/</g, '&lt;') + '</label>').join('') + '</div></details>' : ''; }
document.addEventListener('change', e => { const c = e.target.closest && e.target.closest('#layers [data-ly]'); if(!c) return; S.layers.set(c.dataset.ly, c.checked); fullDraw(); });
$('#openBtn').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; if(f) f.arrayBuffer().then(b => openBuffer(b, f.name)); e.target.value = ''; };
stage.addEventListener('dragover', e => { e.preventDefault(); });
stage.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if(f) f.arrayBuffer().then(b => openBuffer(b, f.name)); });
/* از سامانه: postMessage({cadFile: ArrayBuffer, name}) یا ?src= */
window.addEventListener('message', e => { if(e.origin !== location.origin) return; const d = e.data || {}; if(d.cadFile) openBuffer(d.cadFile, d.name); });
try{ const src = new URLSearchParams(location.search).get('src'); if(src){ busy('در حال دریافت فایل…'); fetch(src).then(r => r.arrayBuffer()).then(b => openBuffer(b, decodeURIComponent(src.split('/').pop().split('?')[0]))); } }catch(e){}
try{ if(window.parent !== window) window.parent.postMessage({cadReady: true}, location.origin); }catch(e){}

/* ---------- نما: viewBox، بزرگ‌نمایی با چرخ، جابه‌جایی، دو انگشت ---------- */
/* نما: viewBox برای لایهٔ نشانه‌ها (سبک) + Canvas برای نقشه */
function apply(now){ const v = S.vb; view.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h); view.style.setProperty('--px', v.w / (stage.clientWidth || 1));
  if(now) fullDraw(); else quickDraw(); drawLabels(); }
function commit(){ fullDraw(); }
const flush = () => {};
function fit(){
  let b = S.base;
  if(!b) b = {x: 0, y: 0, w: 1000, h: 1000};
  const W = stage.clientWidth || 800, H = stage.clientHeight || 600, pad = .06;
  let w = b.w * (1 + pad * 2), h = b.h * (1 + pad * 2);
  if(w / h > W / H) h = w * H / W; else w = h * W / H;
  S.vb = {x: b.x + b.w / 2 - w / 2, y: b.y + b.h / 2 - h / 2, w, h}; apply(true);
}
function toWorld(cx, cy){ const p = view.createSVGPoint(); p.x = cx; p.y = cy; const m = mkG.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : {x: cx, y: cy}; }
function zoomAt(cx, cy, f){ const r = stage.getBoundingClientRect(), v = S.vb; const px = v.x + (cx - r.left) / r.width * v.w, py = v.y + (cy - r.top) / r.height * v.h;
  v.w *= f; v.h *= f; v.x = px - (cx - r.left) / r.width * v.w; v.y = py - (cy - r.top) / r.height * v.h; apply(); }
stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * .0015)); }, {passive: false});
$('#zin').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, .7); };
$('#zout').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.4); };
$('#zfit').onclick = fit;
window.addEventListener('resize', () => apply(true));
const ptrs = new Map(); let pan = null, pinch = null;
stage.addEventListener('pointerdown', e => {
  if(e.target.closest('.zoom')) return;
  flush();
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(ptrs.size === 2){ const [a, b] = Array.from(ptrs.values()); pinch = {d: Math.hypot(a.x - b.x, a.y - b.y)}; pan = null; return; }
  if(S.tool === 'pan' || e.button === 1){ pan = {x: e.clientX, y: e.clientY, vb: Object.assign({}, S.vb)}; stage.classList.add('drag'); return; }
  if(e.button !== 0) return;
  addPoint(snap(toWorld(e.clientX, e.clientY), e));
});
stage.addEventListener('pointermove', e => {
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(pinch && ptrs.size === 2){ const [a, b] = Array.from(ptrs.values()), d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.d / d); pinch.d = d; return; }
  if(pan){ const r = stage.getBoundingClientRect(); S.vb.x = pan.vb.x - (e.clientX - pan.x) / r.width * pan.vb.w; S.vb.y = pan.vb.y - (e.clientY - pan.y) / r.height * pan.vb.h; apply(); return; }
  if(S.tool !== 'pan') flush();
  const w = toWorld(e.clientX, e.clientY), sp = S.tool !== 'pan' ? snap(w, e) : w;
  const c = $('#coords'); c.hidden = false; c.textContent = 'X ' + (+w.x).toFixed(1) + '   Y ' + (+w.y).toFixed(1);
  preview(sp);
});
const up = e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch = null; if(pan){ pan = null; stage.classList.remove('drag'); commit(); } };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('dblclick', e => { if(S.cur) finish(); });

/* ---------- گیرش (Snap) به نقاط انتهایی خطوط نقشه و نشانه‌ها ---------- */
function index(){ const all = S.snaps.concat(...S.marks.map(m => m.pts.map(p => [p.x, p.y])));
  let bw = 1000; if(S.base) bw = Math.max(S.base.w, S.base.h); S.snapCell = Math.max(bw / 200, 1e-6); S.grid = new Map();
  all.forEach(p => { const k = Math.floor(p[0] / S.snapCell) + ':' + Math.floor(p[1] / S.snapCell); if(!S.grid.has(k)) S.grid.set(k, []); S.grid.get(k).push(p); }); }
function snap(w, e){
  if(e && e.altKey) return w;
  const tol = 10 * S.vb.w / (stage.clientWidth || 1); let best = null, bd = tol;
  const cx = Math.floor(w.x / S.snapCell), cy = Math.floor(w.y / S.snapCell), r = Math.ceil(tol / S.snapCell);
  for(let i = -r; i <= r; i++) for(let j = -r; j <= r; j++){ const L = S.grid.get((cx + i) + ':' + (cy + j)); if(L) L.forEach(p => { const d = Math.hypot(p[0] - w.x, p[1] - w.y); if(d < bd){ bd = d; best = p; } }); }
  if(S.cur && S.cur.pts.length && e && e.shiftKey){ const a = S.cur.pts[S.cur.pts.length - 1]; return Math.abs(w.x - a.x) > Math.abs(w.y - a.y) ? {x: w.x, y: a.y} : {x: a.x, y: w.y}; }
  return best ? {x: best[0], y: best[1], snapped: true} : w;
}

/* ---------- ابزارها ---------- */
const HINT = {pan: '', line: 'نقطهٔ اول و دوم را بزنید · Shift: افقی/عمودی · Alt: بدون گیرش', measure: 'دو نقطه را بزنید تا فاصله نشان داده شود',
  area: 'گوشه‌ها را یکی‌یکی بزنید · دابل‌کلیک یا Enter برای بستن · Esc لغو', hatch: 'محدودهٔ هاشور را بکشید · دابل‌کلیک یا Enter برای بستن'};
function setTool(t){ S.tool = t; cancel(); document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); stage.className = 'stage t-' + t;
  const h = $('#hint'); h.hidden = !HINT[t]; h.textContent = HINT[t] || ''; }
document.querySelectorAll('#tools button').forEach(b => b.onclick = () => setTool(b.dataset.t));
window.addEventListener('keydown', e => { if(e.target.matches('input,select')) return;
  const k = e.key.toLowerCase();
  if(k === 'escape') cancel(); else if(k === 'enter') finish(); else if(k === 'h') setTool('pan'); else if(k === 'l') setTool('line'); else if(k === 'a') setTool('area'); else if(k === 'b') setTool('hatch'); else if(k === 'm') setTool('measure');
  else if((k === 'delete' || k === 'backspace') && S.sel >= 0){ S.marks.splice(S.sel, 1); S.sel = -1; save(); render(); }
  else if(k === 'z' && (e.ctrlKey || e.metaKey) && S.marks.length){ S.marks.pop(); save(); render(); } });
function addPoint(p){
  if(!S.cur) S.cur = {type: S.tool, pts: [], color: $('#col').value, pat: $('#hpat').value, name: ''};
  S.cur.pts.push({x: p.x, y: p.y});
  if((S.tool === 'line' || S.tool === 'measure') && S.cur.pts.length === 2) finish();
  else preview(p);
}
function finish(){
  const c = S.cur; if(!c) return;
  const need = c.type === 'area' || c.type === 'hatch' ? 3 : 2;
  if(c.pts.length >= need){ if(c.type === 'area') c.name = 'محدودهٔ ' + toFa(S.marks.filter(m => m.type === 'area').length + 1); if(c.type === 'hatch') c.name = 'هاشور ' + toFa(S.marks.filter(m => m.type === 'hatch').length + 1);
    S.marks.push(c); S.sel = S.marks.length - 1; save(); }
  S.cur = null; tmpG.innerHTML = ''; render(); index();
}
function cancel(){ S.cur = null; tmpG.innerHTML = ''; }
const len = pts => pts.reduce((t, p, i) => i ? t + Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y) : 0, 0);
const area = pts => Math.abs(pts.reduce((t, p, i) => { const q = pts[(i + 1) % pts.length]; return t + p.x * q.y - q.x * p.y; }, 0) / 2);
const U = () => +$('#unit').value;   /* واحد نقشه در هر متر */
const mLen = v => v / U(), mArea = v => v / (U() * U());
const pstr = pts => pts.map(p => p.x + ',' + p.y).join(' ');
function patId(c, pat){ const id = 'p' + pat + c.replace('#', ''); if(!document.getElementById(id)){
    const defs = view.querySelector('defs'), sz = 8 * S.vb.w / (stage.clientWidth || 1);
    const p = document.createElementNS(NS, 'pattern'); p.id = id; p.setAttribute('patternUnits', 'userSpaceOnUse');
    const s2 = Math.max(sz, 1e-6); p.setAttribute('width', s2); p.setAttribute('height', s2);
    const sw = s2 / 6;
    if(pat === 'diag'){ p.setAttribute('patternTransform', 'rotate(45)'); p.innerHTML = '<line x1="0" y1="0" x2="0" y2="' + s2 + '" stroke="' + c + '" stroke-width="' + sw + '"/>'; }
    else if(pat === 'cross'){ p.setAttribute('patternTransform', 'rotate(45)'); p.innerHTML = '<line x1="0" y1="0" x2="0" y2="' + s2 + '" stroke="' + c + '" stroke-width="' + sw + '"/><line x1="0" y1="0" x2="' + s2 + '" y2="0" stroke="' + c + '" stroke-width="' + sw + '"/>'; }
    else p.innerHTML = '<circle cx="' + s2 / 2 + '" cy="' + s2 / 2 + '" r="' + sw * 1.2 + '" fill="' + c + '"/>';
    defs.appendChild(p); } return id; }
function shape(m, i){
  const c = m.color || '#2f6f9f', on = i === S.sel;
  if(m.type === 'line' || m.type === 'measure') return '<polyline data-i="' + i + '" points="' + pstr(m.pts) + '" fill="none" stroke="' + c + '" stroke-width="' + (on ? 3 : 2) + '"' + (m.type === 'measure' ? ' stroke-dasharray="6 4"' : '') + ' vector-effect="non-scaling-stroke"/>';
  const fill = m.type === 'hatch' ? (m.pat === 'solid' ? c : 'url(#' + patId(c, m.pat) + ')') : c;
  return '<polygon data-i="' + i + '" points="' + pstr(m.pts) + '" fill="' + fill + '" fill-opacity="' + (m.type === 'area' ? .14 : (m.pat === 'solid' ? .45 : 1)) + '" stroke="' + c + '" stroke-width="' + (on ? 2.6 : 1.6) + '" vector-effect="non-scaling-stroke"/>';
}
function preview(p){
  if(!S.cur || !S.cur.pts.length){ tmpG.innerHTML = p && p.snapped ? '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (5 * S.vb.w / stage.clientWidth) + '" fill="none" stroke="#e67e22" stroke-width="2" vector-effect="non-scaling-stroke"/>' : ''; return; }
  const c = S.cur, pts = c.pts.concat(p ? [p] : []), col = c.color;
  const closed = c.type === 'area' || c.type === 'hatch';
  const L = closed && pts.length >= 3 ? 'مساحت ' + fmt(mArea(area(pts))) + ' m²' : 'طول ' + fmt(mLen(len(pts))) + ' m';
  tmpG.innerHTML = (closed ? '<polygon points="' + pstr(pts) + '" fill="' + col + '" fill-opacity=".12" stroke="' + col + '" stroke-width="1.6" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>'
    : '<polyline points="' + pstr(pts) + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>')
    + (p && p.snapped ? '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (5 * S.vb.w / stage.clientWidth) + '" fill="none" stroke="#e67e22" stroke-width="2" vector-effect="non-scaling-stroke"/>' : '')
    + label(p || pts[pts.length - 1], L);
}
function label(p, t){ const k = S.vb.w / (stage.clientWidth || 1), sy = S.flipY;
  return '<g transform="translate(' + p.x + ',' + p.y + ') scale(' + k + ',' + (k * sy) + ')"><text class="lab" x="10" y="-10">' + t + '</text></g>'; }
function centroid(pts){ let x = 0, y = 0; pts.forEach(p => { x += p.x; y += p.y; }); return {x: x / pts.length, y: y / pts.length}; }
function drawLabels(){ render(true); }
function render(onlyDraw){
  mkG.innerHTML = S.marks.map(shape).join('') + S.marks.map((m, i) => {
    const t = m.type === 'area' || m.type === 'hatch' ? (m.name ? m.name + ' · ' : '') + fmt(mArea(area(m.pts))) + ' m²' : fmt(mLen(len(m.pts))) + ' m';
    return label(m.type === 'area' || m.type === 'hatch' ? centroid(m.pts) : m.pts[1], t); }).join('');
  if(onlyDraw === true) return;
  const L = $('#list');
  L.innerHTML = S.marks.length ? S.marks.map((m, i) => { const closed = m.type === 'area' || m.type === 'hatch';
    return '<div class="mk' + (i === S.sel ? ' on' : '') + '" data-i="' + i + '"><i style="background:' + m.color + '"></i>'
      + (closed ? '<input type="text" value="' + (m.name || '').replace(/"/g, '&quot;') + '" data-nm="' + i + '" placeholder="نام ریز محل">' : '<span>' + (m.type === 'measure' ? 'اندازه' : 'خط') + '</span>')
      + '<button type="button" data-del="' + i + '" title="حذف">×</button>'
      + '<small>' + (closed ? 'مساحت ' + fmt(mArea(area(m.pts))) + ' m² · محیط ' + fmt(mLen(len(m.pts.concat([m.pts[0]])))) + ' m' : 'طول ' + fmt(mLen(len(m.pts))) + ' m') + '</small></div>'; }).join('')
    : '<p style="color:var(--muted);padding:6px 8px;font-size:12px;line-height:1.9">با «محدوده» گوشه‌های هر ریز محل را بزنید تا مساحت و محیطش حساب شود؛ با «هاشور» محدودهٔ رنگی و با «خط» و «اندازه» فاصله‌ها را بکشید. همه روی همین دستگاه برای همین فایل ذخیره می‌شود.</p>';
  const A = S.marks.filter(m => m.type === 'area');
  $('#cnt').textContent = S.marks.length ? toFa(S.marks.length) : '';
  $('#sum').innerHTML = A.length ? '<span>جمع مساحت محدوده‌ها</span><b>' + fmt(A.reduce((t, m) => t + mArea(area(m.pts)), 0)) + ' m²</b><button type="button" class="btn" id="csv">خروجی اکسل (CSV)</button>' : '';
  const cv = $('#csv'); if(cv) cv.onclick = csv;
}
$('#list').addEventListener('click', e => { const d = e.target.closest('[data-del]'); if(d){ S.marks.splice(+d.dataset.del, 1); S.sel = -1; save(); render(); index(); return; }
  const r = e.target.closest('.mk'); if(r){ S.sel = +r.dataset.i; render(); } });
$('#list').addEventListener('input', e => { const n = e.target.closest('[data-nm]'); if(n){ S.marks[+n.dataset.nm].name = n.value; save(); render(true); } });
$('#unit').onchange = () => { try{ localStorage.setItem('cad.unit', $('#unit').value); }catch(e){} render(); };
try{ const u = localStorage.getItem('cad.unit'); if(u) $('#unit').value = u; }catch(e){}
function save(){ try{ localStorage.setItem(S.key, JSON.stringify(S.marks)); }catch(e){} try{ if(window.parent !== window) window.parent.postMessage({cadMarks: S.marks, name: S.file, unit: U()}, location.origin); }catch(e){} }
function loadMarks(){ try{ S.marks = JSON.parse(localStorage.getItem(S.key) || '[]') || []; }catch(e){ S.marks = []; } render(); index(); }
function csv(){ const rows = [['نام', 'نوع', 'مساحت m2', 'محیط/طول m']].concat(S.marks.map(m => [m.name || '', m.type, (m.type === 'area' || m.type === 'hatch') ? mArea(area(m.pts)).toFixed(2) : '', ((m.type === 'area' || m.type === 'hatch') ? mLen(len(m.pts.concat([m.pts[0]]))) : mLen(len(m.pts))).toFixed(2)]));
  const b = new Blob(['﻿' + rows.map(r => r.join(',')).join('\n')], {type: 'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = (S.file || 'cad') + '-areas.csv'; a.click(); }
$('#pngBtn').onclick = () => { const s = new XMLSerializer().serializeToString(view), W = stage.clientWidth * 2, H = stage.clientHeight * 2;
  const st = getComputedStyle(document.documentElement), bg = st.getPropertyValue('--paper') || '#fff', dr = st.getPropertyValue('--draw') || '#000';
  const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, W, H); fullDraw(); x.drawImage(cv, 0, 0, W, H); x.drawImage(img, 0, 0, W, H); const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = (S.file || 'cad') + '.png'; a.click(); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.replace(/var\(--draw\)/g, dr).replace('<svg ', '<svg width="' + W + '" height="' + H + '" ')); };
setTool('pan');
</script>
</body>
