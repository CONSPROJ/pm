<!doctype html>
<html lang="fa" dir="rtl">
<head>

<title>برنامهٔ زمان‌بندی — سامانهٔ پروژه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f5f7;--surface:#fff;--field:#eef0f3;--line:#e2e5ea;--line2:#eceef2;--ink:#1d2430;--muted:#6b7586;--acc:#2f6f9f;--ok:#3f8a62;--bad:#c0392b;--warn:#b7791f;--crit:#d64545;--bar:#4a86b8;--sum:#34495e;--bl:#b8c0cc;--row:34px;}

  :root[data-theme="dark"]{--bg:#11151b;--surface:#181d25;--field:#222833;--line:#2c3440;--line2:#232a34;--ink:#e6e9ee;--muted:#9aa3b1;--bar:#5d97c9;--sum:#9fb3c8;--bl:#56606e;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:12.5px;}
  body{display:flex;flex-direction:column;overflow:hidden;}
  button{font:inherit;}
  .top{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);}
  .ttl{display:flex;flex-direction:column;gap:1px;margin-inline-end:auto;min-width:0;} .ttl b{font-size:15px;font-weight:800;} .ttl small{color:var(--muted);font-size:11.5px;}
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;font-size:12px;font-weight:700;background:var(--field);color:var(--ink);white-space:nowrap;}
  .btn:hover{filter:brightness(.96);} .btn.pri{background:var(--acc);color:#fff;} .btn.on{background:color-mix(in srgb, var(--acc) 14%, var(--surface));color:var(--acc);} .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn svg{width:15px;height:15px;}

  input, select{font:inherit;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 8px;min-width:0;}
  input:focus, select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 15%, transparent);}
  .kp{flex:none;display:flex;gap:8px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface);}
  .kp > div{flex:none;min-width:118px;padding:8px 12px;border-radius:12px;background:var(--field);display:flex;flex-direction:column;gap:2px;}
  .kp u{text-decoration:none;font-size:10.5px;color:var(--muted);font-weight:700;} .kp b{font-size:15px;font-weight:800;} .kp small{font-size:10.5px;color:var(--muted);}
  .kp .good b{color:var(--ok);} .kp .badk b{color:var(--bad);}
  .main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0, var(--tw, 760px)) 6px minmax(0,1fr);}
  .split{cursor:col-resize;background:var(--line2);} .split:hover{background:var(--acc);}
  .tw{overflow:auto;background:var(--surface);position:relative;} .gw{overflow:auto;position:relative;background:var(--surface);}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;}
  thead th{position:sticky;top:0;z-index:3;background:var(--surface);height:44px;padding:0 6px;font-size:11px;font-weight:700;color:var(--muted);text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{height:var(--row);padding:0 4px;border-bottom:1px solid var(--line2);white-space:nowrap;}
  tbody tr:hover td{background:color-mix(in srgb, var(--acc) 4%, var(--surface));}
  tbody tr.sel td{background:color-mix(in srgb, var(--acc) 9%, var(--surface));}
  tbody tr.sum td{font-weight:800;} tbody tr.crit td.nm .nmx{color:var(--crit);}
  td input{height:26px;width:100%;border-color:transparent;background:transparent;padding:0 5px;font-size:12px;}
  td input:hover{border-color:var(--line);} td input:focus{background:var(--surface);}
  td.n{width:34px;color:var(--muted);text-align:center;font-size:11px;} td.c{width:54px;color:var(--muted);font-size:11px;direction:ltr;text-align:end;}
  td.nm{min-width:220px;} .nmw{display:flex;align-items:center;gap:2px;} .tg{all:unset;cursor:pointer;width:16px;text-align:center;color:var(--muted);flex:none;font-size:10px;} .tg.x{visibility:hidden;}
  td.d{width:58px;} td.dt{width:92px;} td.pr{width:120px;} td.pc{width:62px;} td.fl{width:50px;text-align:center;color:var(--muted);} td.bd{width:110px;} td.ct{width:120px;}

  .bar.crit{background:var(--crit);} .bar .pg{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px;background:rgba(0,0,0,.28);pointer-events:none;}
  .bar .rz{position:absolute;inset-block:0;inset-inline-end:-4px;width:9px;cursor:ew-resize;}

  .dlg-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);} .dlg-h b{font-size:14.5px;font-weight:800;flex:1 1 auto;}
  .dlg-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px;} .dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);}
  .fx{display:flex;flex-direction:column;gap:5px;} .fx > span{font-size:11.5px;font-weight:700;color:var(--muted);} .fx small{font-size:11px;color:var(--muted);line-height:1.7;}
  .wd{display:flex;gap:6px;flex-wrap:wrap;} .wd label{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--field);font-size:12px;font-weight:600;cursor:pointer;} .wd input{height:auto;}
  textarea{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px;min-height:80px;resize:vertical;direction:ltr;text-align:end;}

  table.rt{width:100%;font-size:12.5px;} table.rt th{position:static;height:34px;} table.rt td{padding:5px 6px;border-bottom:1px solid var(--line2);} table.rt td small{display:block;color:var(--muted);font-size:10.5px;} table.rt input{width:110px;}
  .aw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:62vh;}
  table.al{border-collapse:separate;border-spacing:0;font-size:11px;width:auto;} table.al thead td, table.al thead th{position:sticky;top:0;z-index:2;background:var(--surface);height:30px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);}
  table.al th{position:sticky;inset-inline-start:0;z-index:1;background:var(--surface);text-align:start;padding:6px 10px;min-width:180px;border-inline-end:1px solid var(--line);white-space:nowrap;} table.al thead th{z-index:3;} table.al th small{display:block;font-weight:500;color:var(--muted);font-size:10px;}
  table.al td{min-width:38px;height:40px;text-align:center;border-bottom:1px solid var(--line2);border-inline-start:1px solid var(--line2);background:color-mix(in srgb, var(--acc) calc(var(--l, 0) * 38%), var(--surface));}
  table.al td b{display:block;font-size:11.5px;} table.al td small{display:block;font-size:9.5px;color:var(--ok);font-weight:700;} table.al td.ov{background:color-mix(in srgb, var(--crit) 30%, var(--surface));} table.al td.ov b{color:var(--bad);} table.al thead td.now{color:var(--warn);}
  .hl{display:flex;flex-direction:column;gap:8px;} .hr{padding:9px 12px;border-radius:12px;background:var(--field);} .hh{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;} .hh small{color:var(--muted);font-size:11px;}
  .hc{font-size:12px;line-height:1.9;} .hc u{text-decoration:none;color:var(--muted);font-weight:700;} .hc s{color:var(--muted);} .hc em{font-style:normal;font-weight:700;} .hc i{font-style:normal;font-weight:700;} .hc .ad{color:var(--ok);} .hc .rm{color:var(--bad);}
  .io{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--field);} .io b{font-size:13px;} .io small{color:var(--muted);font-size:11.5px;line-height:1.8;margin-bottom:6px;} .io .btn{align-self:flex-start;background:var(--surface);} .io .btn.pri{background:var(--acc);}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);line-height:2;}
  @media (max-width:900px){ .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);} .split{display:none;} .top .hide-s{display:none;} td.bd, td.ct, th.bd, th.ct, td.pr, th.pr, td.vr, th.vr{display:none;} .fb input{width:100%;} }
  @media print{ body{height:auto;overflow:visible;} .top, .st, .split, .kp .noprint{display:none !important;} .main{display:block;} .tw, .gw{overflow:visible;} .gw{page-break-before:always;} }

<script>
'use strict';
/* ====== برنامهٔ زمان‌بندی (CPM) ======
   داده: جدول lists، نوع «زمان‌بندی» (هر فعالیت یک ردیف «id¦JSON»)، «زمان‌بندی: تنظیم» و «زمان‌بندی: خط مبنا».
   محاسبه روی روزهای کاری تقویم پروژه؛ مدت و تأخیر (lag) به روز کاری. */
const SUPA_URL = 'https://paqevdgkufdafskhgnxq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhcWV2ZGdrdWZkYWZza2hnbnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTYwNjYsImV4cCI6MjEwMzgzMjA2Nn0.vNvsKdqEkxhAAKdxqhzePeGZm5PPLrVXFiTyjTmvl24';
const K_ACT = 'زمان‌بندی', K_CFG = 'زمان‌بندی: تنظیم', K_BL = 'زمان‌بندی: خط مبنا';
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const FA = '۰۱۲۳۴۵۶۷۸۹', toFa = v => String(v == null ? '' : v).replace(/\d/g, d => FA[d]);
const toEn = v => String(v == null ? '' : v).replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const money = n => n ? toFa(Math.round(n).toLocaleString('en-US')) : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
try{ const th = new URLSearchParams(location.search).get('theme'); if(th) document.documentElement.dataset.theme = th; }catch(e){}

/* ---------- تاریخ شمسی ---------- */
function g2j(gy,gm,gd){ const gdm=[0,31,59,90,120,151,181,212,243,273,304,334]; let jy; if(gy<=1600){jy=0;gy-=621;}else{jy=979;gy-=1600;}
  const gy2=(gm>2)?(gy+1):gy; let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053); days%=12053; jy+=4*Math.floor(days/1461); days%=1461; if(days>365){jy+=Math.floor((days-1)/365); days=(days-1)%365;}
  const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30); const jd=1+((days<186)?(days%31):((days-186)%30)); return [jy,jm,jd]; }
function j2g(jy, jm, jd){ let gy = (jy > 979) ? 1600 : 621; jy -= (jy > 979) ? 979 : 0;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm < 7) ? (jm-1)*31 : ((jm-7)*30) + 186);
  gy += 400*Math.floor(days/146097); days %= 146097; if(days > 36524){ gy += 100*Math.floor(--days/36524); days %= 36524; if(days >= 365) days++; }
  gy += 4*Math.floor(days/1461); days %= 1461; if(days > 365){ gy += Math.floor((days-1)/365); days = (days-1)%365; }
  let gd = days + 1; const ml = [0,31,((gy%4===0 && gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31]; let gm; for(gm = 0; gm < 13 && gd > ml[gm]; gm++) gd -= ml[gm]; return [gy, gm, gd]; }
const DAY = 864e5;
/* «روز» = شمار روز از ۱۹۷۰ (UTC)، برای حساب بی‌دردسر */
const fa2d = s => { const m = toEn(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if(!m) return null; const g = j2g(+m[1], +m[2], +m[3]); return Math.round(Date.UTC(g[0], g[1] - 1, g[2]) / DAY); };
const d2fa = d => { const t = new Date(d * DAY); const j = g2j(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); return toFa(j[0] + '/' + String(j[1]).padStart(2, '0') + '/' + String(j[2]).padStart(2, '0')); };
const d2parts = d => { const t = new Date(d * DAY); return g2j(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
const todayD = () => { const n = new Date(); return Math.round(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY); };
const MON = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WDN = ['ش','ی','د','س','چ','پ','ج'];        /* شنبه تا جمعه */
const wdOf = d => (new Date(d * DAY).getUTCDay() + 1) % 7;    /* ۰ = شنبه */

/* ---------- وضعیت ---------- */
const S = {acts: [], cfg: {start: todayD(), wd: [1,1,1,1,1,0.5,0], hol: [], status: todayD(), zoom: 'w', hist: [], blSel: ''}, bls: [], sel: '', ro: true, me: '', fold: new Set(), err: '', calc: null};

function compute(){

  if(S.flt === 'late') return lateOf(a, r) > 0;
  if(S.flt === 'prog') return (+a.pc || 0) > 0 && (+a.pc || 0) < 100;
  if(S.flt === 'res') return rsOf(a).length > 0;
  return true; }
function lateOf(a, r){ if((+a.pc || 0) >= 100) return 0; const pl = plannedPct(r.es, r.ef, S.cfg.status); return Math.max(0, Math.round(pl - (+a.pc || 0))); }
function blVar(a, r){ const bl = S.bls.find(b => b.id === S.cfg.blSel) || S.bls[S.bls.length - 1]; if(!bl || !bl.o.d[a.id] || !r) return null; const f = r.ef > r.es ? wDay(r.ef - 1) : wDay(r.es); return wIdx(f) - wIdx(bl.o.d[a.id][1]); }

/* ---------- شروع ---------- */
(async () => {

    const [A, C, B] = await Promise.all([listGet(K_ACT), listGet(K_CFG), listGet(K_BL)]);
    S.acts = A.map(x => Object.assign({id: x.id}, x.o));

    S.bls = bigJoin(B).sort((a, b) => (a.o.at || 0) - (b.o.at || 0));
    S.acts.forEach(a => S.snap.set(a.id, pack(a)));
    try{ S.ctrs = Array.from(new Set((await api('lists?select=value&kind=eq.' + encodeURIComponent('پیمانکار') + '&limit=2000') || []).map(r => String(r.value || '').split('¦')[0].trim()).filter(Boolean))); }catch(e){}
    $('#sts').textContent = 'خوانده شد';
  }catch(e){ $('#sts').textContent = 'خوانده نشد: ' + (e.message || e); if(!tok()){ document.body.insertAdjacentHTML('afterbegin', '<div class="ro-note">اول در سامانه وارد شوید و از میز کار ← برنامهٔ زمان‌بندی باز کنید.</div>'); } }
  if(S.ro) document.body.insertAdjacentHTML('afterbegin', '<div class="ro-note">فقط خواندنی — ویرایش برنامه برای مدیر پروژه و ادمین است.</div>');
  $$('[data-ed]').forEach(b => { if(S.ro) b.disabled = true; });
  $$('[data-z]').forEach(b => b.classList.toggle('on', b.dataset.z === S.cfg.zoom));
  ctrDatalist(); render();
  setTimeout(() => { const gw = $('#gw'); gw.scrollLeft = gw.scrollWidth; }, 60);
  let qt = 0; $('#fq').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 200); });
})();
