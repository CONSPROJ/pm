<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامهٔ زمان‌بندی — سامانهٔ پروژه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f5f7;--surface:#fff;--field:#eef0f3;--line:#e2e5ea;--line2:#eceef2;--ink:#1d2430;--muted:#6b7586;--acc:#2f6f9f;--ok:#3f8a62;--bad:#c0392b;--warn:#b7791f;--crit:#d64545;--bar:#4a86b8;--sum:#34495e;--bl:#b8c0cc;--row:34px;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#11151b;--surface:#181d25;--field:#222833;--line:#2c3440;--line2:#232a34;--ink:#e6e9ee;--muted:#9aa3b1;--bar:#5d97c9;--sum:#9fb3c8;--bl:#56606e;} }
  :root[data-theme="dark"]{--bg:#11151b;--surface:#181d25;--field:#222833;--line:#2c3440;--line2:#232a34;--ink:#e6e9ee;--muted:#9aa3b1;--bar:#5d97c9;--sum:#9fb3c8;--bl:#56606e;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:12.5px;}
  body{display:flex;flex-direction:column;overflow:hidden;}
  button{font:inherit;}
  .top{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);}
  .ttl{display:flex;flex-direction:column;gap:1px;margin-inline-end:auto;min-width:0;} .ttl b{font-size:15px;font-weight:800;} .ttl small{color:var(--muted);font-size:11.5px;}
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;font-size:12px;font-weight:700;background:var(--field);color:var(--ink);white-space:nowrap;}
  .btn:hover{filter:brightness(.96);} .btn.pri{background:var(--acc);color:#fff;} .btn.on{background:color-mix(in srgb, var(--acc) 14%, var(--surface));color:var(--acc);} .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn svg{width:15px;height:15px;}
  .seg{display:inline-flex;background:var(--field);border-radius:10px;padding:3px;gap:2px;} .seg .btn{height:26px;background:transparent;padding:0 9px;} .seg .btn.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  input, select{font:inherit;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 8px;min-width:0;}
  input:focus, select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 15%, transparent);}
  .kp{flex:none;display:flex;gap:8px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface);}
  .kp > div{flex:none;min-width:118px;padding:8px 12px;border-radius:12px;background:var(--field);display:flex;flex-direction:column;gap:2px;}
  .kp u{text-decoration:none;font-size:10.5px;color:var(--muted);font-weight:700;} .kp b{font-size:15px;font-weight:800;} .kp small{font-size:10.5px;color:var(--muted);}
  .kp .good b{color:var(--ok);} .kp .badk b{color:var(--bad);}
  .main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0, var(--tw, 760px)) 6px minmax(0,1fr);}
  .split{cursor:col-resize;background:var(--line2);} .split:hover{background:var(--acc);}
  .tw{overflow:auto;background:var(--surface);position:relative;} .gw{overflow:auto;position:relative;background:var(--surface);}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;}
  thead th{position:sticky;top:0;z-index:3;background:var(--surface);height:44px;padding:0 6px;font-size:11px;font-weight:700;color:var(--muted);text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{height:var(--row);padding:0 4px;border-bottom:1px solid var(--line2);white-space:nowrap;}
  tbody tr:hover td{background:color-mix(in srgb, var(--acc) 4%, var(--surface));}
  tbody tr.sel td{background:color-mix(in srgb, var(--acc) 9%, var(--surface));}
  tbody tr.sum td{font-weight:800;} tbody tr.crit td.nm .nmx{color:var(--crit);}
  td input{height:26px;width:100%;border-color:transparent;background:transparent;padding:0 5px;font-size:12px;}
  td input:hover{border-color:var(--line);} td input:focus{background:var(--surface);}
  td.n{width:34px;color:var(--muted);text-align:center;font-size:11px;} td.c{width:54px;color:var(--muted);font-size:11px;direction:ltr;text-align:end;}
  td.nm{min-width:220px;} .nmw{display:flex;align-items:center;gap:2px;} .tg{all:unset;cursor:pointer;width:16px;text-align:center;color:var(--muted);flex:none;font-size:10px;} .tg.x{visibility:hidden;}
  td.d{width:58px;} td.dt{width:92px;} td.pr{width:120px;} td.pc{width:62px;} td.fl{width:50px;text-align:center;color:var(--muted);} td.bd{width:110px;} td.ct{width:120px;}
  td.ro{color:var(--muted);padding:0 9px;}
  .fl0{color:var(--crit) !important;font-weight:800;}
  .gh{position:sticky;top:0;z-index:3;height:44px;background:var(--surface);border-bottom:1px solid var(--line);}
  .gh .m{position:absolute;top:0;height:22px;border-inline-start:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted);padding:3px 6px;white-space:nowrap;overflow:hidden;}
  .gh .w{position:absolute;top:22px;height:22px;border-inline-start:1px solid var(--line2);font-size:10px;color:var(--muted);padding:4px 3px;white-space:nowrap;overflow:hidden;text-align:center;}
  .gb{position:relative;}
  .gr{position:absolute;inset-inline:0;height:var(--row);border-bottom:1px solid var(--line2);}
  .gr.sel{background:color-mix(in srgb, var(--acc) 7%, transparent);}
  .off{position:absolute;top:0;bottom:0;background:color-mix(in srgb, var(--ink) 3.5%, transparent);pointer-events:none;}
  .bar{position:absolute;height:16px;top:9px;border-radius:5px;background:var(--bar);cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .bar.crit{background:var(--crit);} .bar .pg{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px;background:rgba(0,0,0,.28);pointer-events:none;}
  .bar .rz{position:absolute;inset-block:0;inset-inline-end:-4px;width:9px;cursor:ew-resize;}
  .bar.sum{height:8px;top:13px;border-radius:2px;background:var(--sum);cursor:default;} .bar.sum::before, .bar.sum::after{content:'';position:absolute;top:0;width:0;height:0;border:5px solid transparent;border-top:6px solid var(--sum);}
  .bar.sum::before{inset-inline-start:0;} .bar.sum::after{inset-inline-end:0;}
  .bar.ms{width:14px !important;height:14px;top:10px;border-radius:2px;transform:rotate(45deg);background:var(--ink);}
  .bar.ms.crit{background:var(--crit);}
  .blb{position:absolute;height:5px;top:27px;border-radius:2px;background:var(--bl);pointer-events:none;}
  .lbl{position:absolute;top:8px;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none;}
  .now{position:absolute;top:0;bottom:0;width:0;border-inline-start:2px dashed var(--warn);pointer-events:none;z-index:2;}
  .now span{position:absolute;top:2px;inset-inline-start:3px;font-size:10px;font-weight:800;color:var(--warn);background:var(--surface);padding:0 3px;border-radius:4px;white-space:nowrap;}
  svg.lk{position:absolute;top:0;inset-inline-start:0;pointer-events:none;overflow:visible;z-index:1;}
  svg.lk path{fill:none;stroke:var(--muted);stroke-width:1.2;} svg.lk path.c{stroke:var(--crit);stroke-width:1.5;}
  .st{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--muted);}
  .st .er{color:var(--bad);font-weight:700;} .st .sv{margin-inline-start:auto;}
  .dlg-bg{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.4);display:grid;place-items:center;padding:12px;}
  .dlg{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 30px 80px -24px rgba(0,0,0,.5);}
  .dlg-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);} .dlg-h b{font-size:14.5px;font-weight:800;flex:1 1 auto;}
  .dlg-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px;} .dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);}
  .fx{display:flex;flex-direction:column;gap:5px;} .fx > span{font-size:11.5px;font-weight:700;color:var(--muted);} .fx small{font-size:11px;color:var(--muted);line-height:1.7;}
  .wd{display:flex;gap:6px;flex-wrap:wrap;} .wd label{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--field);font-size:12px;font-weight:600;cursor:pointer;} .wd input{height:auto;}
  textarea{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px;min-height:80px;resize:vertical;direction:ltr;text-align:end;}
  .scv{width:100%;height:260px;display:block;}
  .lg{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;} .lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-inline-end:4px;vertical-align:middle;}
  .ro-note{padding:6px 14px;background:color-mix(in srgb, var(--warn) 10%, var(--surface));color:var(--warn);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--line);}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);line-height:2;}
  @media (max-width:900px){ .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);} .split{display:none;} .top .hide-s{display:none;} td.bd, td.ct, th.bd, th.ct, td.pr, th.pr{display:none;} }
  @media print{ body{height:auto;overflow:visible;} .top, .st, .split, .kp .noprint{display:none !important;} .main{display:block;} .tw, .gw{overflow:visible;} .gw{page-break-before:always;} }
</style>
</head>
<body>
<div class="top">
  <span class="ttl"><b>برنامهٔ زمان‌بندی</b><small id="sub">CPM · مسیر بحرانی · خط مبنا · ارزش کسب‌شده</small></span>
  <button class="btn pri" data-a="add" data-ed>+ فعالیت</button>
  <button class="btn" data-a="in" data-ed title="زیرمجموعهٔ ردیف بالا">→ تورفتگی</button>
  <button class="btn" data-a="out" data-ed title="بیرون آوردن از گروه">← بیرون</button>
  <button class="btn" data-a="up" data-ed title="جابه‌جایی به بالا">▲</button>
  <button class="btn" data-a="dn" data-ed title="جابه‌جایی به پایین">▼</button>
  <button class="btn" data-a="del" data-ed>حذف</button>
  <span class="seg"><button class="btn" data-z="d">روز</button><button class="btn on" data-z="w">هفته</button><button class="btn" data-z="m">ماه</button></span>
  <button class="btn" data-a="cfg">تقویم و تنظیم</button>
  <button class="btn" data-a="bl" data-ed>خط مبنا</button>
  <button class="btn" data-a="evm">منحنی S</button>
  <button class="btn hide-s" data-a="tpl" data-ed>قالب ساختمانی</button>
  <button class="btn hide-s" data-a="csv">اکسل</button>
  <button class="btn hide-s" data-a="print">چاپ</button>
</div>
<div class="kp" id="kp"></div>
<div class="main" id="main">
  <div class="tw" id="tw"><table><thead><tr>
    <th></th><th>کد</th><th>نام فعالیت</th><th>مدت</th><th>شروع</th><th>پایان</th><th class="pr">پیش‌نیاز</th><th>پیشرفت</th><th title="شناوری کل (روز کاری)">شناوری</th><th class="bd">بودجه (تومان)</th><th class="ct">مسئول / پیمانکار</th>
  </tr></thead><tbody id="tb"></tbody></table></div>
  <div class="split" id="split"></div>
  <div class="gw" id="gw"><div class="gh" id="gh"></div><div class="gb" id="gb"></div></div>
</div>
<div class="st"><span id="stl"></span><span class="er" id="ste"></span><span class="sv" id="sts"></span></div>
<script>
'use strict';
/* ====== برنامهٔ زمان‌بندی (CPM) ======
   داده: جدول lists، نوع «زمان‌بندی» (هر فعالیت یک ردیف «id¦JSON»)، «زمان‌بندی: تنظیم» و «زمان‌بندی: خط مبنا».
   محاسبه روی روزهای کاری تقویم پروژه؛ مدت و تأخیر (lag) به روز کاری. */
const SUPA_URL = 'https://paqevdgkufdafskhgnxq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhcWV2ZGdrdWZkYWZza2hnbnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTYwNjYsImV4cCI6MjEwMzgzMjA2Nn0.vNvsKdqEkxhAAKdxqhzePeGZm5PPLrVXFiTyjTmvl24';
const K_ACT = 'زمان‌بندی', K_CFG = 'زمان‌بندی: تنظیم', K_BL = 'زمان‌بندی: خط مبنا';
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const FA = '۰۱۲۳۴۵۶۷۸۹', toFa = v => String(v == null ? '' : v).replace(/\d/g, d => FA[d]);
const toEn = v => String(v == null ? '' : v).replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const money = n => n ? toFa(Math.round(n).toLocaleString('en-US')) : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
try{ const th = new URLSearchParams(location.search).get('theme'); if(th) document.documentElement.dataset.theme = th; }catch(e){}

/* ---------- تاریخ شمسی ---------- */
function g2j(gy,gm,gd){ const gdm=[0,31,59,90,120,151,181,212,243,273,304,334]; let jy; if(gy<=1600){jy=0;gy-=621;}else{jy=979;gy-=1600;}
  const gy2=(gm>2)?(gy+1):gy; let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053); days%=12053; jy+=4*Math.floor(days/1461); days%=1461; if(days>365){jy+=Math.floor((days-1)/365); days=(days-1)%365;}
  const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30); const jd=1+((days<186)?(days%31):((days-186)%30)); return [jy,jm,jd]; }
function j2g(jy, jm, jd){ let gy = (jy > 979) ? 1600 : 621; jy -= (jy > 979) ? 979 : 0;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm < 7) ? (jm-1)*31 : ((jm-7)*30) + 186);
  gy += 400*Math.floor(days/146097); days %= 146097; if(days > 36524){ gy += 100*Math.floor(--days/36524); days %= 36524; if(days >= 365) days++; }
  gy += 4*Math.floor(days/1461); days %= 1461; if(days > 365){ gy += Math.floor((days-1)/365); days = (days-1)%365; }
  let gd = days + 1; const ml = [0,31,((gy%4===0 && gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31]; let gm; for(gm = 0; gm < 13 && gd > ml[gm]; gm++) gd -= ml[gm]; return [gy, gm, gd]; }
const DAY = 864e5;
/* «روز» = شمار روز از ۱۹۷۰ (UTC)، برای حساب بی‌دردسر */
const fa2d = s => { const m = toEn(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if(!m) return null; const g = j2g(+m[1], +m[2], +m[3]); return Math.round(Date.UTC(g[0], g[1] - 1, g[2]) / DAY); };
const d2fa = d => { const t = new Date(d * DAY); const j = g2j(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); return toFa(j[0] + '/' + String(j[1]).padStart(2, '0') + '/' + String(j[2]).padStart(2, '0')); };
const d2parts = d => { const t = new Date(d * DAY); return g2j(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
const todayD = () => { const n = new Date(); return Math.round(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY); };
const MON = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WDN = ['ش','ی','د','س','چ','پ','ج'];        /* شنبه تا جمعه */
const wdOf = d => (new Date(d * DAY).getUTCDay() + 1) % 7;    /* ۰ = شنبه */

/* ---------- وضعیت ---------- */
const S = {acts: [], cfg: {start: todayD(), wd: [1,1,1,1,1,0.5,0], hol: [], status: todayD(), zoom: 'w', hist: [], blSel: ''}, bls: [], sel: '', ro: true, me: '', fold: new Set(), err: '', calc: null};
const dirty = new Set(); let saveT = 0, cfgDirty = false;

/* ---------- سرور ---------- */
const tok = () => { try{ return localStorage.getItem('siteLogM.tok.v1') || ''; }catch(e){ return ''; } };
const pj = () => { try{ return localStorage.getItem('siteLogM.project.v1') || 'p1'; }catch(e){ return 'p1'; } };
const pjCol = () => { try{ return sessionStorage.getItem('siteLogM.pjCol') === '1'; }catch(e){ return false; } };
async function api(path, o){ o = o || {};
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, {method: o.method || 'GET', headers: Object.assign({'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json', 'Prefer': o.prefer || 'return=minimal', 'x-pm-project': pj()}, tok() ? {'x-pm-token': tok()} : {}, o.headers || {}), body: o.body ? JSON.stringify(o.body) : undefined});
  if(!res.ok){ let t = ''; try{ t = await res.text(); }catch(e){} const er = new Error(t || ('کد ' + res.status)); er.status = res.status; throw er; }
  const t = await res.text(); return t ? JSON.parse(t) : null; }
async function listGet(kind){ const R = await api('lists?select=value&kind=eq.' + encodeURIComponent(kind) + '&limit=5000') || [];
  return R.map(r => { const v = String(r.value || ''), i = v.indexOf('¦'); if(i < 0) return null; try{ return {id: v.slice(0, i), o: JSON.parse(v.slice(i + 1))}; }catch(e){ return null; } }).filter(Boolean); }
async function listPut(kind, id, o){
  await api('lists?kind=eq.' + encodeURIComponent(kind) + '&value=like.' + encodeURIComponent(String(id).replace(/[*%]/g, '') + '¦*'), {method: 'DELETE'}).catch(() => {});
  if(!o) return;
  const body = [{kind, value: id + '¦' + JSON.stringify(o)}];
  try{ await api('lists?on_conflict=kind,value' + (pjCol() ? '%2Cproject_id' : ''), {method: 'POST', headers: {'Prefer': 'resolution=merge-duplicates'}, body}); }
  catch(e){ if(/42P10|no unique/i.test(e.message)) await api('lists?on_conflict=kind,value%2Cproject_id', {method: 'POST', headers: {'Prefer': 'resolution=merge-duplicates'}, body}); else throw e; } }
function queueSave(id){ if(S.ro) return; if(id === '__cfg') cfgDirty = true; else dirty.add(id); clearTimeout(saveT); saveT = setTimeout(flush, 700); $('#sts').textContent = 'در حال ذخیره…'; }
async function flush(){
  const ids = Array.from(dirty); dirty.clear(); const c = cfgDirty; cfgDirty = false;
  try{
    for(const id of ids){ const a = S.acts.find(x => x.id === id); await listPut(K_ACT, id, a ? pack(a) : null); }
    if(c) await listPut(K_CFG, 'cfg', S.cfg);
    $('#sts').textContent = 'ذخیره شد ✓ ' + new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ ids.forEach(i => dirty.add(i)); if(c) cfgDirty = true; $('#sts').textContent = 'ذخیره نشد؛ دوباره تلاش می‌شود'; setTimeout(flush, 5000); }
}
const pack = a => ({n: a.n, p: a.p || '', o: a.o, d: a.d, dep: a.dep || [], pc: a.pc || 0, sn: a.sn || null, as: a.as || null, af: a.af || null, b: a.b || 0, ac: a.ac || 0, who: a.who || '', ms: a.ms ? 1 : 0});

/* ---------- تقویم کاری ---------- */
let CAL = null;
function buildCal(){
  const hol = new Set((S.cfg.hol || []).map(fa2d).filter(x => x != null));
  const st = S.cfg.start - 30, n = 365 * 12, W = [], idx = new Map();
  for(let d = st, k = 0; d < st + n; d++){ const w = S.cfg.wd[wdOf(d)]; if(w > 0 && !hol.has(d)){ idx.set(d, W.length); W.push(d); } }
  CAL = {W, idx, hol};
}
/* اولین روز کاری از d به بعد (شمارهٔ روز کاری) */

function compute(){
  buildCal();

      else if(s.t === 'FF') lf = Math.min(lf, x.lf - s.l); else if(s.t === 'SF') lf = Math.min(lf, x.lf - s.l + r.du); });

    .concat(ROWS.map((x, i) => { const a = x.a, r = C.R.get(a.id) || {}; const sum = C.isSum(a); return [i + 1, W.get(a.id), '  '.repeat(x.lv) + a.n, r.du, toEn(d2fa(wDay(r.es))), toEn(d2fa(wDay(Math.max(r.es, r.ef - 1)))), sum ? '' : toEn(depTxt(a, num)), Math.round(sum ? C.pcOf(a) : (+a.pc || 0)), r.tf, (!sum && r.tf <= 0) ? 'بله' : '', sum ? C.bOf(a) : (+a.b || ''), sum ? C.acOf(a) : (+a.ac || ''), a.who || ''].map(q).join(','); }));
  const b = new Blob(['﻿' + L.join('\r\n')], {type: 'text/csv;charset=utf-8'}); const u = URL.createObjectURL(b); const x = document.createElement('a'); x.href = u; x.download = 'برنامه-زمان‌بندی-' + toEn(d2fa(todayD())).replace(/\//g, '-') + '.csv'; x.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); }

/* ---------- شروع ---------- */
(async () => {
  $('#sts').textContent = 'در حال خواندن…';
  try{
    const who = await api('rpc/pm_whoami', {method: 'POST', body: {}}).catch(() => null);
    S.me = (who && (who.name || who.n)) || '';
    let ed = false; try{ ed = new URLSearchParams(location.search).get('ed') === '1'; }catch(e){}
    S.ro = !(who && (who.admin || (ed && who.name)));
    const [A, C, B] = await Promise.all([listGet(K_ACT), listGet(K_CFG), listGet(K_BL)]);
    S.acts = A.map(x => Object.assign({id: x.id}, x.o));
    const c = C.find(x => x.id === 'cfg'); if(c) S.cfg = Object.assign(S.cfg, c.o);
    S.bls = B.sort((a, b) => (a.o.at || 0) - (b.o.at || 0));
    $('#sts').textContent = 'خوانده شد';
  }catch(e){ $('#sts').textContent = 'خوانده نشد: ' + (e.message || e); if(!tok()){ document.body.insertAdjacentHTML('afterbegin', '<div class="ro-note">اول در سامانه وارد شوید و از میز کار ← برنامهٔ زمان‌بندی باز کنید.</div>'); } }
  if(S.ro) document.body.insertAdjacentHTML('afterbegin', '<div class="ro-note">فقط خواندنی — ویرایش برنامه برای مدیر پروژه و ادمین است.</div>');
  $$('[data-ed]').forEach(b => { if(S.ro) b.disabled = true; });
  $$('[data-z]').forEach(b => b.classList.toggle('on', b.dataset.z === S.cfg.zoom));
  render();
  setTimeout(() => { const gw = $('#gw'); gw.scrollLeft = gw.scrollWidth; }, 60);
})();
window.addEventListener('beforeunload', e => { if(dirty.size || cfgDirty){ flush(); e.preventDefault(); e.returnValue = ''; } });
