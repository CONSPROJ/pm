# هر تغییر در سرور: بررسی نوع، آزمون‌های سرتاسری روی Postgres واقعی، ممیزی امنیتی وابستگی‌ها و ساخت ایمیج Docker.
# اگر یکی رد شود، آن تغییر نباید منتشر شود.
name: backend
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pm, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: pmtest }
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U pm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
        env: { TEST_DATABASE_URL: 'postgres://pm@127.0.0.1:55432/pmtest' }
      - run: npm audit --omit=dev --audit-level=high
  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pm-backend:ci backend
